<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Integration Plugins - Comprehensive Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .test-section {
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .section-header {
            background: #f5f5f5;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header:hover {
            background: #eeeeee;
        }

        .section-header h2 {
            font-size: 20px;
            color: #333;
        }

        .section-header .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge.success {
            background: #4caf50;
            color: white;
        }

        .badge.error {
            background: #f44336;
            color: white;
        }

        .badge.pending {
            background: #ff9800;
            color: white;
        }

        .section-content {
            padding: 20px;
        }

        .test-group {
            margin-bottom: 20px;
        }

        .test-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-item.success {
            background: #e8f5e9;
            border-color: #4caf50;
        }

        .test-item.error {
            background: #ffebee;
            border-color: #f44336;
        }

        .test-item.running {
            background: #fff3e0;
            border-color: #ff9800;
        }

        .test-details {
            flex: 1;
        }

        .test-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .test-description {
            font-size: 14px;
            color: #666;
        }

        .test-result {
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button.primary {
            background: #667eea;
            color: white;
        }

        button.primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background: #d0d0d0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .visualization-container {
            margin-top: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            min-height: 400px;
            background: #fafafa;
        }

        .log-output {
            background: #263238;
            color: #aed581;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .log-success {
            color: #4caf50;
        }

        .log-error {
            color: #f44336;
        }

        .log-info {
            color: #2196f3;
        }

        .log-warning {
            color: #ff9800;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧬 Database Integration Plugins Test Suite</h1>
            <p>Comprehensive validation for STRING, KEGG, and EcoCyc plugins</p>
        </div>

        <div class="content">
            <!-- Test Statistics -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalTests">0</div>
                    <div class="stat-label">Total Tests</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="passedTests">0</div>
                    <div class="stat-label">Passed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="failedTests">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="testDuration">0s</div>
                    <div class="stat-label">Duration</div>
                </div>
            </div>

            <!-- Test Controls -->
            <div class="controls">
                <button class="primary" onclick="runAllTests()">▶ Run All Tests</button>
                <button class="secondary" onclick="runStringTests()">STRING Tests</button>
                <button class="secondary" onclick="runKEGGTests()">KEGG Tests</button>
                <button class="secondary" onclick="runEcoCycTests()">EcoCyc Tests</button>
                <button class="secondary" onclick="clearResults()">🗑️ Clear Results</button>
            </div>

            <!-- STRING Plugin Tests -->
            <div class="test-section">
                <div class="section-header" onclick="toggleSection('string-section')">
                    <h2>🧬 STRING Network Explorer Tests</h2>
                    <span class="badge pending" id="string-badge">Pending</span>
                </div>
                <div class="section-content" id="string-section">
                    <div id="string-tests"></div>
                    <div class="visualization-container" id="string-viz"></div>
                </div>
            </div>

            <!-- KEGG Plugin Tests -->
            <div class="test-section">
                <div class="section-header" onclick="toggleSection('kegg-section')">
                    <h2>🔬 KEGG Pathway Viewer Tests</h2>
                    <span class="badge pending" id="kegg-badge">Pending</span>
                </div>
                <div class="section-content" id="kegg-section">
                    <div id="kegg-tests"></div>
                    <div class="visualization-container" id="kegg-viz"></div>
                </div>
            </div>

            <!-- EcoCyc Plugin Tests -->
            <div class="test-section">
                <div class="section-header" onclick="toggleSection('ecocyc-section')">
                    <h2>🦠 EcoCyc Pathway Analyzer Tests</h2>
                    <span class="badge pending" id="ecocyc-badge">Pending</span>
                </div>
                <div class="section-content" id="ecocyc-section">
                    <div id="ecocyc-tests"></div>
                    <div class="visualization-container" id="ecocyc-viz"></div>
                </div>
            </div>

            <!-- Log Output -->
            <div class="log-output" id="logOutput"></div>
        </div>
    </div>

            log(message, type = 'info') {
                const logOutput = document.getElementById('logOutput');
                const entry = document.createElement('div');
                entry.className = `log-entry log-${type}`;
                const timestamp = new Date().toLocaleTimeString();
                entry.textContent = `[${timestamp}] ${message}`;
                logOutput.appendChild(entry);
                logOutput.scrollTop = logOutput.scrollHeight;
                console.log(message);
            }

            async runTest(testName, testFn, containerId) {
                this.results.total++;
                this.updateStats();

                const container = document.getElementById(containerId);
                const testItem = document.createElement('div');
                testItem.className = 'test-item running';
                testItem.innerHTML = `
                    <div class="test-details">
                        <div class="test-name">${testName}</div>
                        <div class="test-description">Running...</div>
                    </div>
                    <div class="test-result">⏳</div>
                `;
                container.appendChild(testItem);

                try {
                    this.log(`Running: ${testName}`, 'info');
                    const result = await testFn();
                    
                    testItem.className = 'test-item success';
                    testItem.querySelector('.test-description').textContent = result.message || 'Passed';
                    testItem.querySelector('.test-result').textContent = '✓';
                    
                    this.results.passed++;
                    this.log(`✓ ${testName}: ${result.message}`, 'success');
                    
                    return { success: true, result };
                } catch (error) {
                    testItem.className = 'test-item error';
                    testItem.querySelector('.test-description').textContent = error.message;
                    testItem.querySelector('.test-result').textContent = '✗';
                    
                    this.results.failed++;
                    this.log(`✗ ${testName}: ${error.message}`, 'error');
                    
                    return { success: false, error };
                }
            }

            updateStats() {
                document.getElementById('totalTests').textContent = this.results.total;
                document.getElementById('passedTests').textContent = this.results.passed;
                document.getElementById('failedTests').textContent = this.results.failed;
                
                if (this.startTime) {
                    const duration = ((Date.now() - this.startTime) / 1000).toFixed(1);
                    document.getElementById('testDuration').textContent = `${duration}s`;
                }
            }

            updateBadge(badgeId, status) {
                const badge = document.getElementById(badgeId);
                badge.className = `badge ${status}`;
                badge.textContent = status === 'success' ? 'Passed' : status === 'error' ? 'Failed' : 'Running';
            }

            reset() {
                this.results = { total: 0, passed: 0, failed: 0, duration: 0 };
                this.startTime = Date.now();
                this.updateStats();
            }
        }

        const testSuite = new DatabasePluginTestSuite();

        // STRING Plugin Tests
        async function runStringTests() {
            testSuite.log('Starting STRING Network Explorer tests...', 'info');
            testSuite.updateBadge('string-badge', 'running');
            
            const container = document.getElementById('string-tests');
            container.innerHTML = '';

            try {
                // Test 1: Plugin Installation and Metadata Check
                await testSuite.runTest(
                    'STRING Plugin Installation and Metadata Verification',
                    async () => {
                        if (!window.pluginManagerV2) {
                            throw new Error('PluginManagerV2 not available');
                        }
                        
                        const plugin = window.pluginManagerV2.getPlugin('string-network-explorer');
                        if (!plugin) {
                            throw new Error('STRING plugin not installed');
                        }
                        
                        // Verify plugin metadata
                        if (!plugin.name || !plugin.version) {
                            throw new Error('Plugin missing required metadata');
                        }
                        
                        // Verify supportedDataTypes
                        if (!plugin.supportedDataTypes || !Array.isArray(plugin.supportedDataTypes)) {
                            throw new Error('Plugin missing supportedDataTypes array');
                        }
                        
                        return {
                            message: `Plugin verified: ${plugin.name} v${plugin.version} (${plugin.supportedDataTypes.length} data types)`
                        };
                    },
                    'string-tests'
                );

                // Test 2: API Structure and Data Format Validation
                await testSuite.runTest(
                    'STRING API Data Structure Validation',
                    async () => {
                        const mockResponse = testSuite.testData.string.basic;
                        
                        // Validate network structure
                        if (!mockResponse.nodes || !Array.isArray(mockResponse.nodes)) {
                            throw new Error('Invalid network structure: missing nodes array');
                        }
                        
                        if (!mockResponse.edges || !Array.isArray(mockResponse.edges)) {
                            throw new Error('Invalid network structure: missing edges array');
                        }
                        
                        // Validate node properties
                        mockResponse.nodes.forEach((node, idx) => {
                            if (!node.id || !node.name) {
                                throw new Error(`Node ${idx} missing required id or name`);
                            }
                        });
                        
                        // Validate edge properties
                        mockResponse.edges.forEach((edge, idx) => {
                            if (!edge.source || !edge.target) {
                                throw new Error(`Edge ${idx} missing required source or target`);
                            }
                            if (typeof edge.confidence === 'undefined') {
                                throw new Error(`Edge ${idx} missing confidence score`);
                            }
                        });
                        
                        return {
                            message: `Valid structure: ${mockResponse.nodes.length} nodes, ${mockResponse.edges.length} edges, ${mockResponse.description}`
                        };
                    },
                    'string-tests'
                );

                // Test 3: Basic Network Visualization
                await testSuite.runTest(
                    'STRING Network Visualization - Basic (p53 Network)',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('string-network-explorer');
                        if (!plugin.executor) {
                            throw new Error('Plugin executor not found');
                        }

                        const mockData = testSuite.testData.string.basic;
                        const vizContainer = document.getElementById('string-viz');
                        vizContainer.innerHTML = '';
                        
                        const startTime = performance.now();
                        const result = await plugin.executor(mockData);
                        const renderTime = Math.round(performance.now() - startTime);
                        
                        if (!(result instanceof HTMLElement)) {
                            throw new Error('Executor did not return HTMLElement');
                        }
                        
                        // Verify SVG was created
                        const svg = result.querySelector('svg');
                        if (!svg) {
                            throw new Error('Visualization missing SVG element');
                        }
                        
                        vizContainer.appendChild(result);
                        
                        return {
                            message: `Rendered ${mockData.name} in ${renderTime}ms: ${mockData.nodes.length} proteins, ${mockData.edges.length} interactions`
                        };
                    },
                    'string-tests'
                );

                // Test 4: Complex Network Visualization
                await testSuite.runTest(
                    'STRING Network Visualization - Complex (DNA Damage Response)',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('string-network-explorer');
                        const mockData = testSuite.testData.string.complex;
                        
                        const startTime = performance.now();
                        const result = await plugin.executor(mockData);
                        const renderTime = Math.round(performance.now() - startTime);
                        
                        if (!(result instanceof HTMLElement)) {
                            throw new Error('Complex network visualization failed');
                        }
                        
                        // Performance validation
                        if (renderTime > 5000) {
                            throw new Error(`Rendering too slow: ${renderTime}ms (threshold: 5000ms)`);
                        }
                        
                        return {
                            message: `Complex network rendered in ${renderTime}ms: ${mockData.nodes.length} proteins with ${mockData.edges.length} interactions`
                        };
                    },
                    'string-tests'
                );

                // Test 5: Edge Case - Empty Network
                await testSuite.runTest(
                    'STRING Network Edge Case - Empty Network Handling',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('string-network-explorer');
                        const emptyData = {
                            nodes: [],
                            edges: []
                        };
                        
                        try {
                            const result = await plugin.executor(emptyData);
                            if (result instanceof HTMLElement) {
                                return { message: 'Empty network handled gracefully' };
                            } else {
                                throw new Error('Invalid response for empty network');
                            }
                        } catch (error) {
                            // Acceptable to throw error for empty data
                            return { message: 'Empty network rejected appropriately: ' + error.message };
                        }
                    },
                    'string-tests'
                );

                testSuite.updateBadge('string-badge', 'success');
            } catch (error) {
                testSuite.updateBadge('string-badge', 'error');
                testSuite.log(`STRING tests failed: ${error.message}`, 'error');
            }
        }

        // KEGG Plugin Tests
        async function runKEGGTests() {
            testSuite.log('Starting KEGG Pathway Viewer tests...', 'info');
            testSuite.updateBadge('kegg-badge', 'running');
            
            const container = document.getElementById('kegg-tests');
            container.innerHTML = '';

            try {
                // Test 1: Plugin Installation and Metadata Verification
                await testSuite.runTest(
                    'KEGG Plugin Installation and Metadata Verification',
                    async () => {
                        if (!window.pluginManagerV2) {
                            throw new Error('PluginManagerV2 not available');
                        }
                        
                        const plugin = window.pluginManagerV2.getPlugin('kegg-pathway-viewer');
                        if (!plugin) {
                            throw new Error('KEGG plugin not installed');
                        }
                        
                        if (!plugin.name || !plugin.version) {
                            throw new Error('Plugin missing required metadata');
                        }
                        
                        if (!plugin.supportedDataTypes || !Array.isArray(plugin.supportedDataTypes)) {
                            throw new Error('Plugin missing supportedDataTypes array');
                        }
                        
                        return {
                            message: `Plugin verified: ${plugin.name} v${plugin.version} (${plugin.supportedDataTypes.length} data types)`
                        };
                    },
                    'kegg-tests'
                );

                // Test 2: KEGG Pathway Data Structure Validation
                await testSuite.runTest(
                    'KEGG Pathway Data Structure Validation',
                    async () => {
                        const mockPathway = testSuite.testData.kegg.basic;
                        
                        if (!mockPathway.nodes || !Array.isArray(mockPathway.nodes)) {
                            throw new Error('Invalid pathway structure: missing nodes array');
                        }
                        
                        if (!mockPathway.edges || !Array.isArray(mockPathway.edges)) {
                            throw new Error('Invalid pathway structure: missing edges array');
                        }
                        
                        // Validate node types (compounds and reactions)
                        const nodeTypes = mockPathway.nodes.map(n => n.type);
                        if (!nodeTypes.includes('compound') || !nodeTypes.includes('reaction')) {
                            throw new Error('Pathway should contain both compound and reaction nodes');
                        }
                        
                        // Validate edge types
                        mockPathway.edges.forEach((edge, idx) => {
                            if (!edge.source || !edge.target) {
                                throw new Error(`Edge ${idx} missing required source or target`);
                            }
                            if (!edge.type || !['substrate', 'product', 'cofactor'].includes(edge.type)) {
                                throw new Error(`Edge ${idx} has invalid type: ${edge.type}`);
                            }
                        });
                        
                        return {
                            message: `Valid KEGG structure: ${mockPathway.name} - ${mockPathway.nodes.length} components`
                        };
                    },
                    'kegg-tests'
                );

                // Test 3: Basic Pathway Visualization (Glycolysis)
                await testSuite.runTest(
                    'KEGG Pathway Visualization - Basic (Glycolysis Initial Steps)',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('kegg-pathway-viewer');
                        if (!plugin.executor) {
                            throw new Error('Plugin executor not found');
                        }

                        const mockData = testSuite.testData.kegg.basic;
                        const vizContainer = document.getElementById('kegg-viz');
                        vizContainer.innerHTML = '';
                        
                        const startTime = performance.now();
                        const result = await plugin.executor(mockData);
                        const renderTime = Math.round(performance.now() - startTime);
                        
                        if (!(result instanceof HTMLElement)) {
                            throw new Error('Executor did not return HTMLElement');
                        }
                        
                        // Verify pathway structure
                        const svg = result.querySelector('svg');
                        if (!svg) {
                            throw new Error('Visualization missing SVG element');
                        }
                        
                        vizContainer.appendChild(result);
                        
                        return {
                            message: `Rendered ${mockData.name} in ${renderTime}ms: ${mockData.nodes.length} components`
                        };
                    },
                    'kegg-tests'
                );

                // Test 4: Complex Pathway with Multiple Node Types
                await testSuite.runTest(
                    'KEGG Pathway Visualization - Complex (Full Glycolysis)',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('kegg-pathway-viewer');
                        const mockData = testSuite.testData.kegg.complex;
                        
                        const startTime = performance.now();
                        const result = await plugin.executor(mockData);
                        const renderTime = Math.round(performance.now() - startTime);
                        
                        if (!(result instanceof HTMLElement)) {
                            throw new Error('Complex pathway visualization failed');
                        }
                        
                        // Performance validation
                        if (renderTime > 5000) {
                            throw new Error(`Rendering too slow: ${renderTime}ms (threshold: 5000ms)`);
                        }
                        
                        return {
                            message: `Complex pathway rendered in ${renderTime}ms: ${mockData.name} with ${mockData.nodes.length} components`
                        };
                    },
                    'kegg-tests'
                );

                // Test 5: KEGG ID Format Validation
                await testSuite.runTest(
                    'KEGG Identifier Format Validation',
                    async () => {
                        const mockData = testSuite.testData.kegg.basic;
                        
                        // Validate KEGG compound ID format (CXXXXX)
                        const compoundNodes = mockData.nodes.filter(n => n.type === 'compound');
                        compoundNodes.forEach(node => {
                            if (!/^C\d{5}$/.test(node.id)) {
                                throw new Error(`Invalid KEGG compound ID format: ${node.id}`);
                            }
                        });
                        
                        // Validate KEGG reaction ID format (RXXXXX)
                        const reactionNodes = mockData.nodes.filter(n => n.type === 'reaction');
                        reactionNodes.forEach(node => {
                            if (!/^R\d{5}$/.test(node.id)) {
                                throw new Error(`Invalid KEGG reaction ID format: ${node.id}`);
                            }
                        });
                        
                        return {
                            message: `KEGG ID formats validated: ${compoundNodes.length} compounds, ${reactionNodes.length} reactions`
                        };
                    },
                    'kegg-tests'
                );

                testSuite.updateBadge('kegg-badge', 'success');
            } catch (error) {
                testSuite.updateBadge('kegg-badge', 'error');
                testSuite.log(`KEGG tests failed: ${error.message}`, 'error');
            }
        }

        // EcoCyc Plugin Tests
        async function runEcoCycTests() {
            testSuite.log('Starting EcoCyc Pathway Analyzer tests...', 'info');
            testSuite.updateBadge('ecocyc-badge', 'running');
            
            const container = document.getElementById('ecocyc-tests');
            container.innerHTML = '';

            try {
                // Test 1: Plugin Installation and Metadata Verification
                await testSuite.runTest(
                    'EcoCyc Plugin Installation and Metadata Verification',
                    async () => {
                        if (!window.pluginManagerV2) {
                            throw new Error('PluginManagerV2 not available');
                        }
                        
                        const plugin = window.pluginManagerV2.getPlugin('ecocyc-pathway-analyzer');
                        if (!plugin) {
                            throw new Error('EcoCyc plugin not installed');
                        }
                        
                        if (!plugin.name || !plugin.version) {
                            throw new Error('Plugin missing required metadata');
                        }
                        
                        if (!plugin.supportedDataTypes || !Array.isArray(plugin.supportedDataTypes)) {
                            throw new Error('Plugin missing supportedDataTypes array');
                        }
                        
                        return {
                            message: `Plugin verified: ${plugin.name} v${plugin.version} (${plugin.supportedDataTypes.length} data types)`
                        };
                    },
                    'ecocyc-tests'
                );

                // Test 2: EcoCyc Pathway Data Structure Validation
                await testSuite.runTest(
                    'EcoCyc Pathway Data Structure Validation (E. coli Specific)',
                    async () => {
                        const mockData = testSuite.testData.ecocyc.basic;
                        
                        if (!mockData.nodes || !Array.isArray(mockData.nodes)) {
                            throw new Error('Invalid pathway structure: missing nodes array');
                        }
                        
                        if (!mockData.edges || !Array.isArray(mockData.edges)) {
                            throw new Error('Invalid pathway structure: missing edges array');
                        }
                        
                        // Validate E. coli specific node types
                        const nodeTypes = mockData.nodes.map(n => n.type);
                        if (!nodeTypes.includes('compound') || !nodeTypes.includes('reaction')) {
                            throw new Error('E. coli pathway should contain both compound and reaction nodes');
                        }
                        
                        // Validate edge structure with IDs
                        mockData.edges.forEach((edge, idx) => {
                            if (!edge.id) {
                                throw new Error(`Edge ${idx} missing required id property`);
                            }
                            if (!edge.source || !edge.target) {
                                throw new Error(`Edge ${idx} missing required source or target`);
                            }
                            if (!edge.type || !['substrate', 'product', 'enzyme', 'cofactor'].includes(edge.type)) {
                                throw new Error(`Edge ${idx} has invalid type: ${edge.type}`);
                            }
                        });
                        
                        return {
                            message: `Valid EcoCyc structure: ${mockData.name} - ${mockData.description}`
                        };
                    },
                    'ecocyc-tests'
                );

                // Test 3: Basic E. coli Pathway Visualization
                await testSuite.runTest(
                    'EcoCyc Pathway Visualization - Basic (L-Arabinose Degradation)',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('ecocyc-pathway-analyzer');
                        if (!plugin.executor) {
                            throw new Error('Plugin executor not found');
                        }

                        const mockData = testSuite.testData.ecocyc.basic;
                        const vizContainer = document.getElementById('ecocyc-viz');
                        vizContainer.innerHTML = '';
                        
                        const startTime = performance.now();
                        const result = await plugin.executor(mockData);
                        const renderTime = Math.round(performance.now() - startTime);
                        
                        if (!(result instanceof HTMLElement)) {
                            throw new Error('Executor did not return HTMLElement');
                        }
                        
                        // Verify SVG structure
                        const svg = result.querySelector('svg');
                        if (!svg) {
                            throw new Error('Visualization missing SVG element');
                        }
                        
                        vizContainer.appendChild(result);
                        
                        return {
                            message: `Rendered ${mockData.name} in ${renderTime}ms: ${mockData.description}`
                        };
                    },
                    'ecocyc-tests'
                );

                // Test 4: Complex Cyclical Pathway (TCA Cycle)
                await testSuite.runTest(
                    'EcoCyc Pathway Visualization - Complex (TCA Cycle)',
                    async () => {
                        const plugin = window.pluginManagerV2.getPlugin('ecocyc-pathway-analyzer');
                        const mockData = testSuite.testData.ecocyc.complex;
                        
                        const startTime = performance.now();
                        const result = await plugin.executor(mockData);
                        const renderTime = Math.round(performance.now() - startTime);
                        
                        if (!(result instanceof HTMLElement)) {
                            throw new Error('Complex cyclical pathway visualization failed');
                        }
                        
                        // Performance validation
                        if (renderTime > 5000) {
                            throw new Error(`Rendering too slow: ${renderTime}ms (threshold: 5000ms)`);
                        }
                        
                        return {
                            message: `Cyclical pathway rendered in ${renderTime}ms: ${mockData.name} (${mockData.nodes.length} compounds)`
                        };
                    },
                    'ecocyc-tests'
                );

                // Test 5: BioCyc Nomenclature Validation
                await testSuite.runTest(
                    'EcoCyc BioCyc Nomenclature Validation',
                    async () => {
                        const mockData = testSuite.testData.ecocyc.basic;
                        
                        // Validate BioCyc-style naming conventions
                        const compounds = mockData.nodes.filter(n => n.type === 'compound');
                        compounds.forEach(node => {
                            if (!node.name || node.name.length === 0) {
                                throw new Error(`Compound ${node.id} missing name`);
                            }
                            // BioCyc compound IDs typically use uppercase with hyphens
                            if (!/^[A-Z0-9-]+$/.test(node.id)) {
                                throw new Error(`Invalid BioCyc compound ID format: ${node.id}`);
                            }
                        });
                        
                        // Validate reaction nomenclature
                        const reactions = mockData.nodes.filter(n => n.type === 'reaction');
                        reactions.forEach(node => {
                            if (!node.name || node.name.length === 0) {
                                throw new Error(`Reaction ${node.id} missing name`);
                            }
                            // BioCyc reaction IDs typically end with -RXN
                            if (!/-RXN$/i.test(node.id)) {
                                throw new Error(`Invalid BioCyc reaction ID format (should end with -RXN): ${node.id}`);
                            }
                        });
                        
                        return {
                            message: `BioCyc nomenclature validated: ${compounds.length} compounds, ${reactions.length} reactions`
                        };
                    },
                    'ecocyc-tests'
                );

                testSuite.updateBadge('ecocyc-badge', 'success');
            } catch (error) {
                testSuite.updateBadge('ecocyc-badge', 'error');
                testSuite.log(`EcoCyc tests failed: ${error.message}`, 'error');
            }
        }

        // Run all tests sequentially
        async function runAllTests() {
            testSuite.reset();
            testSuite.log('='.repeat(60), 'info');
            testSuite.log('Starting comprehensive test suite...', 'info');
            testSuite.log('='.repeat(60), 'info');
            
            await runStringTests();
            await runKEGGTests();
            await runEcoCycTests();
            
            testSuite.log('='.repeat(60), 'info');
            testSuite.log('All tests completed!', 'success');
            testSuite.log(`Results: ${testSuite.results.passed}/${testSuite.results.total} passed`, 'info');
            testSuite.log('='.repeat(60), 'info');
        }

        // Utility functions
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function clearResults() {
            document.getElementById('string-tests').innerHTML = '';
            document.getElementById('kegg-tests').innerHTML = '';
            document.getElementById('ecocyc-tests').innerHTML = '';
            document.getElementById('string-viz').innerHTML = '';
            document.getElementById('kegg-viz').innerHTML = '';
            document.getElementById('ecocyc-viz').innerHTML = '';
            document.getElementById('logOutput').innerHTML = '';
            
            testSuite.reset();
            testSuite.updateBadge('string-badge', 'pending');
            testSuite.updateBadge('kegg-badge', 'pending');
            testSuite.updateBadge('ecocyc-badge', 'pending');
            
            testSuite.log('Test results cleared', 'info');
        }

        // Initialize
        window.addEventListener('load', () => {
            testSuite.log('Database Integration Plugin Test Suite initialized', 'success');
            testSuite.log('Click "Run All Tests" to begin comprehensive validation', 'info');
        });
    </script>
