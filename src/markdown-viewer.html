        try {
          var hint = localStorage.getItem('_uiStyleHint') || 'default';
          var variables = presets[hint] || presets.default;
          var root = document.documentElement;
          root.setAttribute('data-ui-style', presets[hint] ? hint : 'default');
          Object.keys(variables).forEach(function (key) {
            root.style.setProperty(key, variables[key]);
          });
        } catch (_) {
          var fallback = presets.default;
          Object.keys(fallback).forEach(function (key) {
            document.documentElement.style.setProperty(key, fallback[key]);
          });
        }
      })();
    </script>
    <style>
      :root {
        --primary-color: #3b82f6;
        --primary-hover: #2563eb;
        --primary-rgb: 59, 130, 246;
        --secondary-color: #6b7280;
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #f1f5f9;
        --text-primary: #1f2937;
        --text-secondary: #6b7280;
        --text-muted: #9ca3af;
        --border-color: #e5e7eb;
        --border-hover: #d1d5db;
        --header-gradient: linear-gradient(135deg, #2c3e50 0%, #3498db 50%, #667eea 80%);
        --btn-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        --btn-gradient-hover: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        --focus-ring: rgba(59, 130, 246, 0.3);
        --selection-bg: #3b82f6;
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-secondary);
        color: var(--text-primary);
        line-height: 1.6;
        overflow-x: hidden;
      }

      ::selection {
        background: var(--selection-bg);
        color: #ffffff;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-hover);
        border-radius: 999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      /* Toolbar */
      .toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        background: var(--header-gradient);
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 1000;
        -webkit-app-region: drag;
      }

      .toolbar-title {
        font-weight: 500;
        font-size: 13px;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }

      .toolbar-btn {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: #ffffff;
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s,
          box-shadow 0.2s;
      }

      .toolbar-btn:hover {
        background: rgba(255, 255, 255, 0.22);
        border-color: rgba(255, 255, 255, 0.38);
      }

      .toolbar-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.28);
      }

      /* Content */
      .content {
        padding: 68px 40px 44px;
        max-width: 900px;
        margin: 0 auto;
        background: var(--bg-primary);
        min-height: 100vh;
        box-shadow: var(--shadow-md);
      }

      /* Typography */
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: var(--text-primary);
        margin: 1.5em 0 0.5em;
        font-weight: 600;
      }

      h1 {
        font-size: 2em;
        border-bottom: 2px solid var(--primary-color);
        padding-bottom: 0.3em;
        margin-top: 0;
      }

      h2 {
        font-size: 1.5em;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3em;
      }

      h3 {
        font-size: 1.25em;
      }

      h4 {
        font-size: 1.1em;
      }

      p {
        margin: 1em 0;
      }

      a {
        color: var(--primary-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      /* Code */
      code {
        background-color: var(--bg-tertiary);
        color: var(--text-primary);
        padding: 0.2em 0.4em;
        border-radius: var(--radius-sm);
        font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
        font-size: 0.9em;
      }

      pre {
        background-color: var(--bg-secondary);
        padding: 16px;
        border-radius: var(--radius-lg);
        overflow-x: auto;
        margin: 1em 0;
        border: 1px solid var(--border-color);
      }

      pre code {
        background: none;
        padding: 0;
        font-size: 0.85em;
        line-height: 1.5;
      }

      /* Blockquote */
      blockquote {
        border-left: 4px solid var(--primary-color);
        padding: 0.5em 0 0.5em 16px;
        margin: 1em 0;
        background: rgba(var(--primary-rgb), 0.08);
        color: var(--text-secondary);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      }

      blockquote p {
        margin: 0.5em 0;
      }

      /* Lists */
      ul,
      ol {
        padding-left: 2em;
        margin: 1em 0;
      }

      li {
        margin: 0.3em 0;
      }

      /* Task lists */
      ul.task-list {
        list-style: none;
        padding-left: 0;
      }

      li.task-list-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      li.task-list-item input[type='checkbox'] {
        margin-top: 4px;
        accent-color: var(--primary-color);
      }

      /* Tables */
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
        overflow-x: auto;
        display: block;
      }

      th,
      td {
        border: 1px solid var(--border-color);
        padding: 10px 14px;
        text-align: left;
      }

      th {
        background-color: var(--bg-tertiary);
        font-weight: 600;
        color: var(--text-primary);
      }

      tr:nth-child(even) {
        background-color: var(--bg-secondary);
      }

      /* Images */
      img {
        max-width: 100%;
        height: auto;
        border-radius: var(--radius-md);
        margin: 1em 0;
      }

      /* Horizontal rule */
      hr {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 2em 0;
      }

      /* File info */
      .file-info {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
      }

      /* Loading state */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: var(--text-muted);
      }

      .loading::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid var(--border-color);
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 12px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Print styles */
      @media print {
        .toolbar {
          display: none;
        }

        .content {
          padding: 20px;
          max-width: none;
        }

        body {
          background: white;
          color: black;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          color: black;
        }

        a {
          color: #0066cc;
        }

        pre,
        code {
          background: #f5f5f5;
        }
      }
    </style>
  </head>

  <body>
    <div class="toolbar">
      <span class="toolbar-title" id="title">Markdown Viewer</span>
      <div class="toolbar-actions">
        <button class="toolbar-btn" onclick="printDocument()">Print</button>
        <button class="toolbar-btn" onclick="copyToClipboard()">Copy Raw</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading">Loading markdown...</div>
    </div>

    <script>
      let rawMarkdownContent = '';
      let currentFilePath = '';

      // Configure marked
      if (typeof marked !== 'undefined') {
        marked.setOptions({
          gfm: true,
          breaks: true,
          highlight: function (code, lang) {
            if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
              try {
                return hljs.highlight(code, { language: lang }).value;
              } catch (err) {}
            }
            return code;
          },
        });
      }

      // Listen for markdown content from main process
      if (typeof electronAPI !== 'undefined' && electronAPI.onLoadMarkdown) {
        electronAPI.onLoadMarkdown(data => {
          renderMarkdown(data);
        });
      }

      // Also handle direct message channel
      window.addEventListener('message', event => {
        if (event.data && event.data.type === 'load-markdown') {
          renderMarkdown(event.data);
        }
      });

      function renderMarkdown(data) {
        rawMarkdownContent = data.content || '';
        currentFilePath = data.filePath || '';

        // Update title
        const titleEl = document.getElementById('title');
        if (data.fileName) {
          titleEl.textContent = data.fileName;
          document.title = `${data.fileName} - Markdown Viewer`;
        }

        const contentEl = document.getElementById('content');

        if (typeof marked !== 'undefined') {
          // Render markdown to HTML
          const html = marked.parse(rawMarkdownContent);

          // Add file info footer
          const fileInfo = currentFilePath ? `<div class="file-info">File: ${escapeHtml(currentFilePath)}</div>` : '';

          contentEl.innerHTML = html + fileInfo;

          // Apply syntax highlighting to code blocks
          if (typeof hljs !== 'undefined') {
            contentEl.querySelectorAll('pre code').forEach(block => {
              hljs.highlightElement(block);
            });
          }
        } else {
          // Fallback: show raw content
          contentEl.innerHTML = `<pre><code>${escapeHtml(rawMarkdownContent)}</code></pre>`;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function printDocument() {
        window.print();
      }

      function copyToClipboard() {
        if (rawMarkdownContent) {
          navigator.clipboard
            .writeText(rawMarkdownContent)
            .then(() => {
              showNotification('Copied to clipboard!');
            })
            .catch(err => {
              console.error('Failed to copy:', err);
            });
        }
      }

      function showNotification(message) {
        const notification = document.createElement('div');
        notification.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--primary-color);
        color: white;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 13px;
        z-index: 10000;
        animation: fadeIn 0.3s, fadeOut 0.3s 1.7s;
      `;
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(() => notification.remove(), 2000);
      }

      // Add fade animations
      const style = document.createElement('style');
      style.textContent = `
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
