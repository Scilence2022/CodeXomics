<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/styles/github-dark.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.7.0/lib/languages/json.min.js"></script>
    <style>
      :root {
        --bg-color: #1e1e1e;
        --text-color: #d4d4d4;
        --heading-color: #569cd6;
        --link-color: #4ec9b0;
        --code-bg: #2d2d2d;
        --border-color: #3c3c3c;
        --toolbar-bg: #252526;
        --accent-color: #0078d4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        line-height: 1.6;
        overflow-x: hidden;
      }

      /* Toolbar */
      .toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 40px;
        background: var(--toolbar-bg);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 1000;
        -webkit-app-region: drag;
      }

      .toolbar-title {
        font-weight: 500;
        font-size: 13px;
        color: var(--heading-color);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 70%;
      }

      .toolbar-actions {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }

      .toolbar-btn {
        background: var(--code-bg);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      .toolbar-btn:hover {
        background: var(--border-color);
        border-color: var(--accent-color);
      }

      /* Content */
      .content {
        padding: 60px 40px 40px;
        max-width: 900px;
        margin: 0 auto;
      }

      /* Typography */
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: var(--heading-color);
        margin: 1.5em 0 0.5em;
        font-weight: 600;
      }

      h1 {
        font-size: 2em;
        border-bottom: 2px solid var(--accent-color);
        padding-bottom: 0.3em;
        margin-top: 0;
      }

      h2 {
        font-size: 1.5em;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 0.3em;
      }

      h3 {
        font-size: 1.25em;
      }

      h4 {
        font-size: 1.1em;
      }

      p {
        margin: 1em 0;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      /* Code */
      code {
        background-color: var(--code-bg);
        padding: 0.2em 0.4em;
        border-radius: 4px;
        font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
        font-size: 0.9em;
      }

      pre {
        background-color: var(--code-bg);
        padding: 16px;
        border-radius: 8px;
        overflow-x: auto;
        margin: 1em 0;
        border: 1px solid var(--border-color);
      }

      pre code {
        background: none;
        padding: 0;
        font-size: 0.85em;
        line-height: 1.5;
      }

      /* Blockquote */
      blockquote {
        border-left: 4px solid var(--accent-color);
        padding: 0.5em 0 0.5em 16px;
        margin: 1em 0;
        background: rgba(0, 120, 212, 0.1);
        border-radius: 0 4px 4px 0;
      }

      blockquote p {
        margin: 0.5em 0;
      }

      /* Lists */
      ul,
      ol {
        padding-left: 2em;
        margin: 1em 0;
      }

      li {
        margin: 0.3em 0;
      }

      /* Task lists */
      ul.task-list {
        list-style: none;
        padding-left: 0;
      }

      li.task-list-item {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }

      li.task-list-item input[type='checkbox'] {
        margin-top: 4px;
      }

      /* Tables */
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 1em 0;
        overflow-x: auto;
        display: block;
      }

      th,
      td {
        border: 1px solid var(--border-color);
        padding: 10px 14px;
        text-align: left;
      }

      th {
        background-color: var(--code-bg);
        font-weight: 600;
        color: var(--heading-color);
      }

      tr:nth-child(even) {
        background-color: rgba(255, 255, 255, 0.02);
      }

      /* Images */
      img {
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        margin: 1em 0;
      }

      /* Horizontal rule */
      hr {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 2em 0;
      }

      /* File info */
      .file-info {
        font-size: 12px;
        color: #888;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
      }

      /* Loading state */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: #888;
      }

      .loading::after {
        content: '';
        width: 24px;
        height: 24px;
        border: 2px solid var(--border-color);
        border-top-color: var(--accent-color);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 12px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Print styles */
      @media print {
        .toolbar {
          display: none;
        }

        .content {
          padding: 20px;
          max-width: none;
        }

        body {
          background: white;
          color: black;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
          color: black;
        }

        a {
          color: #0066cc;
        }

        pre,
        code {
          background: #f5f5f5;
        }
      }
    </style>
  </head>

  <body>
    <div class="toolbar">
      <span class="toolbar-title" id="title">Markdown Viewer</span>
      <div class="toolbar-actions">
        <button class="toolbar-btn" onclick="printDocument()">Print</button>
        <button class="toolbar-btn" onclick="copyToClipboard()">Copy Raw</button>
      </div>
    </div>

    <div class="content" id="content">
      <div class="loading">Loading markdown...</div>
    </div>

    <script>
      let rawMarkdownContent = '';
      let currentFilePath = '';

      // Configure marked
      if (typeof marked !== 'undefined') {
        marked.setOptions({
          gfm: true,
          breaks: true,
          highlight: function (code, lang) {
            if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
              try {
                return hljs.highlight(code, { language: lang }).value;
              } catch (err) {}
            }
            return code;
          },
        });
      }

      // Listen for markdown content from main process
      if (typeof electronAPI !== 'undefined' && electronAPI.onLoadMarkdown) {
        electronAPI.onLoadMarkdown(data => {
          renderMarkdown(data);
        });
      }

      // Also handle direct message channel
      window.addEventListener('message', event => {
        if (event.data && event.data.type === 'load-markdown') {
          renderMarkdown(event.data);
        }
      });

      function renderMarkdown(data) {
        rawMarkdownContent = data.content || '';
        currentFilePath = data.filePath || '';

        // Update title
        const titleEl = document.getElementById('title');
        if (data.fileName) {
          titleEl.textContent = data.fileName;
          document.title = `${data.fileName} - Markdown Viewer`;
        }

        const contentEl = document.getElementById('content');

        if (typeof marked !== 'undefined') {
          // Render markdown to HTML
          const html = marked.parse(rawMarkdownContent);

          // Add file info footer
          const fileInfo = currentFilePath ? `<div class="file-info">File: ${currentFilePath}</div>` : '';

          contentEl.innerHTML = html + fileInfo;

          // Apply syntax highlighting to code blocks
          if (typeof hljs !== 'undefined') {
            contentEl.querySelectorAll('pre code').forEach(block => {
              hljs.highlightElement(block);
            });
          }
        } else {
          // Fallback: show raw content
          contentEl.innerHTML = `<pre><code>${escapeHtml(rawMarkdownContent)}</code></pre>`;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      function printDocument() {
        window.print();
      }

      function copyToClipboard() {
        if (rawMarkdownContent) {
          navigator.clipboard
            .writeText(rawMarkdownContent)
            .then(() => {
              showNotification('Copied to clipboard!');
            })
            .catch(err => {
              console.error('Failed to copy:', err);
            });
        }
      }

      function showNotification(message) {
        const notification = document.createElement('div');
        notification.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: var(--accent-color);
        color: white;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 13px;
        z-index: 10000;
        animation: fadeIn 0.3s, fadeOut 0.3s 1.7s;
      `;
        notification.textContent = message;
        document.body.appendChild(notification);

        setTimeout(() => notification.remove(), 2000);
      }

      // Add fade animations
      const style = document.createElement('style');
      style.textContent = `
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    `;
      document.head.appendChild(style);
    </script>
  </body>
</html>
