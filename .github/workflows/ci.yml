name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x for dependency installation
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Use Node.js 20.x for compatibility checks
        if: matrix.node-version == '20.x'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Lint
        run: npm run lint

      - name: Validate version consistency
        run: npm run version-validate

      - name: Validate documentation metadata
        run: node scripts/validate-documentation.js

      - name: Validate tool registry consistency
        run: npm run tool-registry:validate

      - name: Audit production dependencies
        if: matrix.node-version == '22.x'
        run: npm audit --omit=dev --audit-level=high

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  package:
    name: Packaging smoke (electron-builder --dir)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate tool registry manifest
        run: npm run tool-registry:generate

      # Unpacked directory build only — validates that packaging succeeds without
      # producing (or signing/publishing) installer artifacts.
      - name: Package (unpacked)
        run: npx electron-builder --linux --dir --publish never
