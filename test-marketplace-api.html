<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Marketplace API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 { color: #4CAF50; }
        .test-section {
            background: #f5f5f5;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }
        pre {
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <h1>🧪 Plugin Marketplace API Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Direct API Call</h2>
        <button onclick="testDirectAPI()">Test /api/v1/plugins</button>
        <pre id="test1-result">Click button to test...</pre>
    </div>
    
    <div class="test-section">
        <h2>Test 2: Health Check</h2>
        <button onclick="testHealth()">Test /api/v1/health</button>
        <pre id="test2-result">Click button to test...</pre>
    </div>
    
    <div class="test-section">
        <h2>Test 3: With Query Parameter</h2>
        <input type="text" id="searchQuery" placeholder="Search query..." style="padding: 8px; width: 300px;">
        <button onclick="testSearch()">Search Plugins</button>
        <pre id="test3-result">Click button to test...</pre>
    </div>
    
    <script>
        const API_URL = 'http://localhost:3001/api/v1';
        
        async function testDirectAPI() {
            const resultEl = document.getElementById('test1-result');
            resultEl.textContent = 'Testing...';
            
            try {
                console.log('📡 Fetching:', `${API_URL}/plugins`);
                const response = await fetch(`${API_URL}/plugins`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'User-Agent': 'TestClient/1.0'
                    }
                });
                
                console.log('📥 Response status:', response.status);
                const data = await response.json();
                console.log('📦 Response data:', data);
                
                resultEl.innerHTML = `<span class="success">✅ Success!</span>\n` +
                    `Status: ${response.status}\n` +
                    `Success: ${data.success}\n` +
                    `Plugins found: ${data.data?.plugins?.length || 0}\n\n` +
                    `<strong>Plugins:</strong>\n${JSON.stringify(data.data?.plugins || [], null, 2)}`;
                    
            } catch (error) {
                console.error('❌ Error:', error);
                resultEl.innerHTML = `<span class="error">❌ Error!</span>\n${error.message}\n${error.stack}`;
            }
        }
        
        async function testHealth() {
            const resultEl = document.getElementById('test2-result');
            resultEl.textContent = 'Testing...';
            
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                resultEl.innerHTML = `<span class="success">✅ Success!</span>\n` +
                    `Status: ${response.status}\n` +
                    JSON.stringify(data, null, 2);
                    
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error!</span>\n${error.message}`;
            }
        }
        
        async function testSearch() {
            const resultEl = document.getElementById('test3-result');
            const query = document.getElementById('searchQuery').value;
            resultEl.textContent = 'Searching...';
            
            try {
                const params = new URLSearchParams();
                if (query) params.append('query', query);
                params.append('limit', '50');
                
                const url = `${API_URL}/plugins?${params.toString()}`;
                console.log('📡 Fetching:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                resultEl.innerHTML = `<span class="success">✅ Success!</span>\n` +
                    `Query: "${query}"\n` +
                    `Plugins found: ${data.data?.plugins?.length || 0}\n\n` +
                    JSON.stringify(data.data?.plugins || [], null, 2).substring(0, 2000) + '...';
                    
            } catch (error) {
                resultEl.innerHTML = `<span class="error">❌ Error!</span>\n${error.message}`;
            }
        }
        
        // Auto-run test on load
        window.addEventListener('load', () => {
            console.log('🚀 Test page loaded, auto-running API test...');
            testDirectAPI();
        });
    </script>
</body>
</html>
