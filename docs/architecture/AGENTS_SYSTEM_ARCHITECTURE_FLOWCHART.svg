<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <!-- 定义箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="900" fill="#f9f9f9" rx="5" ry="5" />
  
  <!-- Title -->
  <text x="600" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="bold">Agents, Multi-Agent Systems, and Smart Execution Architecture</text>
  
  <!-- User Layer -->
  <rect x="500" y="80" width="200" height="60" fill="#4a90e2" rx="5" ry="5" />
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">User Interaction</text>
  
  <!-- ChatBox Layer -->
  <rect x="400" y="160" width="400" height="70" fill="#50e3c2" rx="5" ry="5" />
  <text x="600" y="195" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">ChatManager</text>
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">System Integration & Message Handling</text>
  
  <!-- Connection User to ChatBox -->
  <line x1="600" y1="140" x2="600" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Core Systems Layer -->
  <rect x="100" y="270" width="300" height="70" fill="#b8e986" rx="5" ry="5" />
  <text x="250" y="305" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Dynamic Tool Registry</text>
  <text x="250" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Intelligent Tool Selection & Management</text>
  
  <rect x="450" y="270" width="300" height="70" fill="#f5a623" rx="5" ry="5" />
  <text x="600" y="305" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">Smart Execution System</text>
  <text x="600" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Optimal Tool Execution Strategies</text>
  
  <rect x="800" y="270" width="300" height="70" fill="#d0021b" rx="5" ry="5" />
  <text x="950" y="305" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="white">Multi-Agent System</text>
  <text x="950" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Agent Coordination & Management</text>
  
  <!-- Connection ChatBox to Core Systems -->
  <line x1="500" y1="230" x2="250" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="600" y1="230" x2="600" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="700" y1="230" x2="950" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- SmartExecutor and FunctionCallsOrganizer -->
  <rect x="350" y="370" width="200" height="50" fill="#f8e71c" rx="5" ry="5" />
  <text x="450" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">SmartExecutor</text>
  
  <rect x="650" y="370" width="200" height="50" fill="#bd10e0" rx="5" ry="5" />
  <text x="750" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">FunctionCallsOrganizer</text>
  
  <!-- Connection Smart Execution Components -->
  <line x1="600" y1="340" x2="450" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="600" y1="340" x2="750" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="550" y1="395" x2="650" y2="395" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Memory System -->
  <rect x="100" y="370" width="200" height="50" fill="#9013fe" rx="5" ry="5" />
  <text x="200" y="400" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold" fill="white">Memory System</text>
  
  <!-- Connection to Memory System -->
  <line x1="250" y1="340" x2="200" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="395" x2="350" y2="395" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Tool Categories -->
  <rect x="100" y="450" width="180" height="30" fill="#7ed321" rx="4" ry="4" />
  <text x="190" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Navigation</text>
  
  <rect x="300" y="450" width="180" height="30" fill="#7ed321" rx="4" ry="4" />
  <text x="390" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Sequence Analysis</text>
  
  <rect x="500" y="450" width="180" height="30" fill="#7ed321" rx="4" ry="4" />
  <text x="590" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Data Retrieval</text>
  
  <rect x="700" y="450" width="180" height="30" fill="#7ed321" rx="4" ry="4" />
  <text x="790" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Advanced Analysis</text>
  
  <rect x="900" y="450" width="180" height="30" fill="#7ed321" rx="4" ry="4" />
  <text x="990" y="470" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">External APIs</text>
  
  <!-- Connection to Tool Categories -->
  <line x1="200" y1="420" x2="190" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="450" y1="420" x2="390" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="450" y1="420" x2="590" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="750" y1="420" x2="790" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="750" y1="420" x2="990" y2="450" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Agents -->
  <rect x="100" y="520" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="190" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">NavigationAgent</text>
  <text x="190" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Browser Navigation</text>
  
  <rect x="300" y="520" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="390" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">AnalysisAgent</text>
  <text x="390" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Sequence Analysis</text>
  
  <rect x="500" y="520" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="590" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">DataAgent</text>
  <text x="590" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Data Management</text>
  
  <rect x="700" y="520" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="790" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">PluginAgent</text>
  <text x="790" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Plugin Management</text>
  
  <rect x="900" y="520" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="990" y="540" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">ExternalAgent</text>
  <text x="990" y="555" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">API Integration</text>
  
  <!-- Additional Agents -->
  <rect x="100" y="580" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="190" y="600" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">DeepResearchAgent</text>
  <text x="190" y="615" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Advanced Research</text>
  
  <rect x="300" y="580" width="180" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="390" y="600" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">CoordinatorAgent</text>
  <text x="390" y="615" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Agent Coordination</text>
  
  <!-- Connection to Agents -->
  <line x1="190" y1="480" x2="190" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="390" y1="480" x2="390" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="590" y1="480" x2="590" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="790" y1="480" x2="790" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="990" y1="480" x2="990" y2="520" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="950" y1="340" x2="590" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  <line x1="950" y1="340" x2="190" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" stroke-dasharray="5,5" />
  
  <!-- Memory Layers -->
  <rect x="100" y="660" width="180" height="30" fill="#9013fe" rx="4" ry="4" opacity="0.8" />
  <text x="190" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">ShortTermMemory</text>
  
  <rect x="300" y="660" width="180" height="30" fill="#9013fe" rx="4" ry="4" opacity="0.7" />
  <text x="390" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">MediumTermMemory</text>
  
  <rect x="500" y="660" width="180" height="30" fill="#9013fe" rx="4" ry="4" opacity="0.6" />
  <text x="590" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">LongTermMemory</text>
  
  <rect x="700" y="660" width="180" height="30" fill="#9013fe" rx="4" ry="4" opacity="0.5" />
  <text x="790" y="680" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">SemanticMemory</text>
  
  <!-- Connection to Memory Layers -->
  <line x1="200" y="420" x2="190" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="200" y="420" x2="390" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="200" y="420" x2="590" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="200" y="420" x2="790" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Execution Results -->
  <rect x="400" y="730" width="400" height="70" fill="#417505" rx="5" ry="5" />
  <text x="600" y="765" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="white">Execution Results & Response</text>
  <text x="600" y="785" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">Results Processing & User Feedback</text>
  
  <!-- Connection Agents to Results -->
  <line x1="190" y1="620" x2="190" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="390" y1="620" x2="390" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="590" y1="560" x2="590" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="790" y1="560" x2="790" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  <line x1="990" y1="560" x2="990" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)" />
  
  <!-- Connection Results to User -->
  <line x1="600" y1="800" x2="600" y2="860" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- User Output -->
  <rect x="500" y="860" width="200" height="40" fill="#50e3c2" rx="5" ry="5" />
  <text x="600" y="885" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="bold">User Output</text>
  
  <!-- Legend -->
  <rect x="950" y="730" width="130" height="170" fill="white" rx="5" ry="5" stroke="#ccc" stroke-width="1" />
  <text x="1015" y="750" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Legend</text>
  
  <rect x="960" y="765" width="12" height="12" fill="#4a90e2" />
  <text x="985" y="776" font-family="Arial, sans-serif" font-size="10" text-anchor="start">User Interaction</text>
  
  <rect x="960" y="785" width="12" height="12" fill="#50e3c2" />
  <text x="985" y="796" font-family="Arial, sans-serif" font-size="10" text-anchor="start">Management Layer</text>
  
  <rect x="960" y="805" width="12" height="12" fill="#b8e986" />
  <text x="985" y="816" font-family="Arial, sans-serif" font-size="10" text-anchor="start">Tool System</text>
  
  <rect x="960" y="825" width="12" height="12" fill="#f5a623" />
  <text x="985" y="836" font-family="Arial, sans-serif" font-size="10" text-anchor="start">Execution System</text>
  
  <rect x="960" y="845" width="12" height="12" fill="#d0021b" />
  <text x="985" y="856" font-family="Arial, sans-serif" font-size="10" text-anchor="start">Agent System</text>
  
  <rect x="960" y="865" width="12" height="12" fill="#9013fe" />
  <text x="985" y="876" font-family="Arial, sans-serif" font-size="10" text-anchor="start">Memory System</text>
  
</svg>