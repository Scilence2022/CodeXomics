# CodeXomics Agent Skills Registry
# This file is the machine-readable index of the built-in agent skills.
# SkillRegistryService merges these entries into each skill's frontmatter to
# supply discovery metadata (category, tags, duration, requirements).
#
# Format version: 1.0.0
# Directory: .agent/skills/

registry_version: 1.0.0
last_updated: '2026-08-03'

# ─── Skill Index ──────────────────────────────────────────────────────────────
skills:
  - id: primer_design
    file: primer_design.md
    version: 2.0.0
    category: primer_design
    complexity: moderate
    typical_duration_seconds: 20
    requires_genome: true
    requires_network: false # runs against the loaded genome; BLAST is opt-in only
    tags: [primers, pcr, amplification, cloning, qpcr]
    triggers:
      - 'design primers'
      - 'PCR primers'
      - 'primer pair'
      - 'amplify'
      - 'qPCR primers'
    mcp_tools_used:
      - get_current_state
      - design_primers
      - jump_to_gene
      - calculate_primer_properties
      - find_primer_binding_sites
      - save_primer

# ─── Skill Selection Logic ────────────────────────────────────────────────────
# Guidance for AI agents on when to choose a skill over ad-hoc tool calls:
selection_guidance:
  - scenario: 'User wants to amplify a gene or region in the lab'
    prefer: primer_design
    reason: 'Adds hairpin screening, genome-wide off-target checking, and saves the pair to the Primers track'

  - scenario: 'User asks only for the Tm or GC of a primer they already have'
    prefer: null
    reason: 'A single calculate_primer_properties call is enough; the full workflow adds no value'
