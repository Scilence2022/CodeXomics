# ─── Skill Selection Logic ────────────────────────────────────────────────────
# Guidance for AI agents on how to choose between skills when triggers overlap:
selection_guidance:
  - scenario: "User asks about gene function with clear annotation gap"
    prefer: gene_annotation_improvement
    reason: "Targeted and fast; focused on improving a single gene's annotation"

  - scenario: "User wants a comprehensive, publishable analysis of a gene"
    prefer: automated_research
    reason: "Covers all evidence types across multiple phases"

  - scenario: "User wants to amplify a specific region in the lab"
    prefer: primer_design
    reason: "Includes experimental validation (BLAST, Tm, GC checks)"

  - scenario: "User provides VCF coordinates or mentions SNP/mutation"
    prefer: variant_context_analysis
    reason: "Specifically designed for positional variant interpretation"

  - scenario: "User asks about gene clusters or co-regulation in bacteria"
    prefer: operon_analysis
    reason: "Operons are prokaryote-specific; this skill handles the full workflow"

  - scenario: "User asks what function a gene has (quick question)"
    prefer: gene_annotation_improvement
    depth: null
    reason: "More targeted than automated_research for single function queries"

  - scenario: "User wants to write a manuscript section about a gene"
    prefer: automated_research
    depth: deep
    reason: "Produces publication-ready, structured output with citations"
