name: request_annotation_approval
version: 2.0.0
description: Record approval from the authenticated curator identity or a trusted local confirmation dialog and obtain a short-lived apply capability.
category: annotation
subcategory: autonomous_curation
execution:
  type: client-side
  requires_data: true
parameters:
  type: object
  properties:
    changeSetId:
      type: string
    expiresInMinutes:
      type: number
      default: 30
    clientId:
      type: string
  required: [changeSetId]
metadata:
  added_in: autonomous_annotation_v2
  priority: high
  tags: [annotation, approval, review]
