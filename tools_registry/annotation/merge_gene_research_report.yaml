name: merge_gene_research_report
version: 1.0.0
description: Create a reviewable ChangeSet from a Deep Gene Research report or structured proposal. It never applies an annotation mutation directly.
category: annotation
subcategory: annotation_crud

execution:
  type: client-side
  requires_data: true

parameters:
  type: object
  properties:
    identifier:
      type: string
      description: The locus_tag, gene name, or protein_id identifying the annotation to update. If omitted, uses the selected gene when available.
    chromosome:
      type: string
      description: Chromosome name (optional).
    annotationProposal:
      type: object
      description: Structured Deep Gene Research proposal with updates, evidence, confidence, summary, reportUrl, detailsUrl, ecNumbers, goTerms, koTerms, pathwayTerms, and dbXrefs.
    report:
      type: string
      description: Raw Deep Gene Research markdown/text report used for fallback extraction of summary, citations, EC, GO, KO, and pathway references.
    sources:
      type: array
      description: Literature/source objects or strings from Deep Gene Research.
      items: {}
    reportUrl:
      type: string
      description: Downloadable final report URL to store on the annotation.
    detailsUrl:
      type: string
      description: Downloadable workflow/details URL to store on the annotation.
    dryRun:
      type: boolean
      description: Compatibility option. The tool always returns a ChangeSet preview without applying it.
      default: true
    overwriteProduct:
      type: boolean
      description: Replace an existing non-placeholder product annotation when true.
      default: false
    agent:
      type: string
      description: Identity recorded in the annotation change history.
      default: deep-gene-research
    clientId:
      type: string
      description: Browser client ID for multi-window support.
      default: default
  required: []

metadata:
  added_in: deep_gene_research_integration
  integration: deep-gene-research
  priority: high
  tags:
    - annotation
    - research
    - evidence
    - deep-gene-research
    - change-tracking
