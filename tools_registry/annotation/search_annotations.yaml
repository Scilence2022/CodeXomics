name: search_annotations
version: 1.0.0
description: 'Full-text search across annotation fields (product, gene, note, locus_tag, etc.) to find annotations matching a query string. Use this when the user asks to search annotations by keyword, find genes by product description, or look up annotations by name pattern. NOT the same as search_features which searches for features by functional category/type, or find_gene_by_name which finds a specific gene by exact name.'
category: annotation
subcategory: annotation_search
keywords:
  - search
  - annotations
  - find
  - query
  - keyword
  - match
  - product
  - gene
  - name
  - description
  - lookup

execution:
  type: client-side
  requires_data: true

parameters:
  type: object
  properties:
    query:
      type: string
      description: Search query string. Case-insensitive search across qualifier fields.
      examples:
        - ligase
        - kinase
        - DNA polymerase
    chromosome:
      type: string
      description: Limit search to a specific chromosome (optional).
    type:
      type: string
      description: Filter by feature type (optional).
    fields:
      type: array
      description: Specific qualifier fields to search in (optional, defaults to all).
      items:
        type: string
    limit:
      type: number
      description: Maximum number of results (default 50).
      default: 50
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
  required:
    - query

sample_usages:
  - user_query: 'Search for annotations matching ligase'
    tool_call: 'search_annotations(query=''ligase'')'
    thought: 'User wants to search annotations by keyword'
    expected_result: 'List of annotations whose product/gene/note fields contain "ligase"'

  - user_query: 'Find genes with kinase in their description'
    tool_call: 'search_annotations(query=''kinase'')'
    thought: 'User wants to search annotation product descriptions for keyword'
    expected_result: 'Annotations with kinase in product or gene name'

  - user_query: 'Search for DNA polymerase annotations'
    tool_call: 'search_annotations(query=''DNA polymerase'')'
    thought: 'User wants to search annotations for a multi-word query'
    expected_result: 'Annotations matching "DNA polymerase" in any field'

  - user_query: 'Find tRNA annotations on chromosome NC_000913'
    tool_call: 'search_annotations(query=''tRNA'', chromosome=''NC_000913'')'
    thought: 'User wants to search annotations on a specific chromosome'
    expected_result: 'tRNA annotations on the specified chromosome'

relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['list_annotations', 'get_annotation']
  alternatives: ['search_features', 'find_gene_by_name']
  prerequisites: []
  follow_up: ['get_annotation', 'list_annotations']

metadata:
  added_in: phase1
  integration: openclaw
  priority: high
  tags:
    - annotation
    - search
