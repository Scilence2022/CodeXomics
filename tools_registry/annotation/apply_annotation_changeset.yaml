name: apply_annotation_changeset
version: 2.0.0
description: Atomically apply an approved annotation ChangeSet only when target hash and revision preconditions still match.
category: annotation
subcategory: autonomous_curation
execution:
  type: client-side
  requires_data: true
parameters:
  type: object
  properties:
    changeSetId:
      type: string
    approvalToken:
      type: string
    clientId:
      type: string
  required: [changeSetId, approvalToken]
metadata:
  added_in: autonomous_annotation_v2
  priority: high
  tags: [annotation, changeset, commit, approval]
