name: analyze_region
version: 1.0.0
description: Analyze a specific genomic interval and optionally return sequence, features, and GC content
category: data_management
keywords:
  - analyze
  - region
  - genomic
  - features
  - gc
  - chromosome
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    chromosome:
      type: string
      description: Chromosome or contig name to analyze, for example chr1 or NC_000913.3
    start:
      type: number
      description: 1-based start coordinate of the genomic interval
    end:
      type: number
      description: 1-based end coordinate of the genomic interval
    includeFeatures:
      type: boolean
      description: Whether to include annotations fully contained in the interval
      default: true
    includeGC:
      type: boolean
      description: Whether to calculate GC content for the interval sequence
      default: true
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
  required:
    - chromosome
    - start
    - end
sample_usages:
  - user_query: Analyze chr1 from 1000 to 2500 and include GC content
    tool_call: analyze_region(chromosome='chr1', start=1000, end=2500, includeFeatures=true, includeGC=true)
    thought: User wants interval-level genomic analysis for a specific chromosome range
    expected_result: Region sequence, length, matching annotations, and GC content
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - data_management
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling: {}
returns:
  success: boolean - Whether operation was successful
  result: object - Operation result
