name: blast_export_results
version: 1.0.0
description: Export BLAST search results in various formats. Defaults to the most recent BLAST search, so format and
  outputPath are usually the only arguments needed.
category: data_management
keywords:
  - blast
  - export
  - results
  - download
  - format
priority: 2
execution:
  type: built-in
  timeout: 30000
  retries: 1
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    searchId:
      type: string
      description: ID of the BLAST search to export results from; omit to export the most recent search
    format:
      type: string
      description: Output format for exported results
      enum:
        - tsv
        - xml
        - json
        - csv
        - text
      default: tsv
    outputPath:
      type: string
      description: File path to save exported results; omit to return the content inline
  required: []
sample_usages:
  - user_query: 'Export BLAST results as CSV'
    tool_call: "blast_export_results(format='csv', outputPath='/tmp/blast_hits.csv')"
    thought: 'User wants the search that just ran written out as CSV'
    expected_result: 'BLAST results exported in CSV format'
relationships:
  depends_on:
    - blast_search_online
    - blast_search_local
  follow_up: []
metadata:
  tags:
    - blast
    - export
    - results
  complexity: simple
  usage_pattern: moderate
error_handling:
  not_found: 'Returns error if no BLAST search has been run, or if the given search ID is not the current one'
  invalid_format: 'Returns error if format is not supported'
returns:
  success: boolean
  outputPath: string - Path to exported file
  format: string - Export format used
  hitCount: integer - Number of hits written
  message: string
