name: codon_usage_analysis
version: 1.1.0
description: Count codons in a supplied sequence (works offline) or look up a geneName or locusTag in a loaded genome window. Return summary counts or detailed observed frequencies.
category: data_management
keywords:
  - codon
  - usage
  - analysis
  - dna
  - coding
  - sequence
  - frequency
  - bias
  - statistics
  - gene
  - locus
  - geneName
  - locusTag
priority: 2
execution:
  type: client
  timeout: 30000
  retries: 3
  requires_auth: false
  requires_data: false
  requires_network: false
parameters:
  type: object
  properties:
    sequence:
      type: string
      minLength: 3
      pattern: ^[ACGTUNRYSWKMBDHVacgtunryswkmbdhv\s]+$
      description: Coding nucleotide sequence. Whitespace is ignored. Takes precedence over geneName and locusTag.
    geneName:
      type: string
      minLength: 1
      description: Gene name to find in the loaded genome, or a label when sequence is supplied.
    locusTag:
      type: string
      minLength: 1
      description: Locus tag to look up in the loaded genome.
    chromosome:
      type: string
      minLength: 1
      description: Chromosome for gene lookup, or the source of the annotated genetic code for a supplied sequence.
        Requires a genome window.
    genetic_code:
      type: string
      description: NCBI translation table ID as a string, or table name. Overrides the annotation. A supplied sequence
        without a chromosome uses the standard table.
    include_statistics:
      type: boolean
      default: true
      description: Return per-codon statistics. Set false for the summary only.
    includeStatistics:
      type: boolean
      description: Compatibility alias for include_statistics. The snake_case value takes precedence.
    organism:
      type: string
      description: Optional descriptive label copied to the result. Does not select the genetic code.
    clientId:
      type: string
      description: Browser client ID for window routing.
  required: []
  anyOf:
    - required:
        - sequence
    - required:
        - geneName
    - required:
        - locusTag
sample_usages:
  - user_query: Analyze codon usage in this DNA sequence
    tool_call: codon_usage_analysis(sequence="ATGGCTAGCTAGCTAGCTAG", include_statistics=true)
    thought: User wants to analyze codon usage patterns in the provided DNA sequence
    expected_result: Detailed codon usage statistics and frequency analysis
  - user_query: codon usage analysis of lacZ gene
    tool_call: codon_usage_analysis(geneName="lacZ", include_statistics=true)
    thought: User wants codon usage analysis for the lacZ gene by gene name
    expected_result: Codon frequency analysis showing usage bias and statistics for lacZ gene
  - user_query: analyze codon usage for locus tag b0001
    tool_call: codon_usage_analysis(locusTag="b0001", include_statistics=true)
    thought: User wants codon usage analysis for the gene with locus tag b0001
    expected_result: Codon frequency analysis showing usage bias and statistics for gene b0001
  - user_query: codon usage analysis of araA gene on chromosome U00096
    tool_call: codon_usage_analysis(geneName="araA", chromosome="U00096", include_statistics=true)
    thought: User wants codon usage analysis for araA gene on specific chromosome
    expected_result: Codon frequency analysis for araA gene on chromosome U00096
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - data_management
    - important
  complexity: moderate
  usage_pattern: common
returns:
  analysisType: 'Input source: sequence, geneName, or locusTag.'
  geneticCode: 'Translation table id and name.'
  totalCodons: 'Count of complete, unambiguous codons.'
  uniqueCodons: 'Number of distinct observed codons.'
  sequenceLength: 'Length after whitespace removal.'
  gene: 'Resolved feature metadata for a genome lookup.'
  codonUsage: 'Detailed rows with codon, aminoAcid, count, frequency (percent), and rscu. Omitted in summary mode.'
  aminoAcidComposition: 'Observed amino acid counts. Omitted in summary mode.'
