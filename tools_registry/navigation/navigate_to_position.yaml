# navigate_to_position.yaml
name: 'navigate_to_position'
version: '1.3.0'
description: 'Navigate to specific genomic coordinates in the genome browser to VISUALIZE the region. Use this when users ask to "show", "display", or "view" a genomic region by coordinates. Coordinates are 1-based base pairs; the chromosome defaults to the one currently displayed, so pass chromosome only when the user names a sequence that is actually loaded. For gene-based navigation, use jump_to_gene instead. For retrieving raw sequence data, use get_sequence instead.'
category: 'navigation'
keywords: ['navigate', 'position', 'coordinates', 'jump', 'go to', 'genome browser', 'location', 'range']
priority: 1

# Tool execution metadata
execution:
  type: 'client'
  timeout: 5000
  retries: 3
  requires_auth: false
  requires_data: true
  requires_network: false

# Input parameters (JSON Schema format)
parameters:
  type: 'object'
  properties:
    chromosome:
      type: 'string'
      description: "Name of a chromosome/contig in the LOADED genome, copied exactly as listed in the current context (e.g. 'U00096', 'NC_000913.3'). OMIT this parameter to stay on the chromosome that is currently displayed — that is the correct choice whenever the user did not name one. Never invent or normalize a name: 'chr1' is only valid if the loaded genome actually contains a sequence called 'chr1'."
    start:
      type: 'number'
      description: 'Start position in base pairs (1-based), as a plain number — expand shorthand before calling (2M/2Mb -> 2000000, 500k/500kb -> 500000). If provided without end, or if start=end, the view will center on this position with a ~2kb window (upstream 1kb, downstream 1kb).'
      minimum: 1
      examples: [1000, 50000, 2000000]
    end:
      type: 'number'
      description: 'End position in base pairs (1-based), as a plain number. Optional — if omitted or equal to start, a 2kb centered window is used instead.'
      minimum: 1
      examples: [2000, 60000, 2001000]
    position:
      type: 'number'
      description: 'Center position in base pairs (1-based) for a 2000bp window (alternative to start/end). Expand shorthand before calling (2M -> 2000000).'
      minimum: 1
      examples: [1500, 55000, 2000000]
    clientId:
      type: 'string'
      description: 'Browser client ID for multi-window support'
      default: 'default'
  anyOf:
    - required: ['start', 'end']
    - required: ['position']
    - required: ['start'] # start-only: center on position with ±1kb window

# High-quality examples for few-shot learning
sample_usages:
  - user_query: 'Navigate to 2M'
    tool_call: 'navigate_to_position(start=2000000)'
    thought: 'The user named no chromosome, so I omit it and the current one is used. "2M" means 2,000,000 bp, not 2 — and start alone centers the view with a ±1kb window.'
    expected_result: 'Browser centers on 2000000 of the current chromosome, showing 1999000-2001000'

  - user_query: 'Show me the region from 50000 to 60000'
    tool_call: 'navigate_to_position(start=50000, end=60000)'
    thought: 'A 10kb region on the chromosome already displayed — no chromosome argument is needed'
    expected_result: 'Browser displays the 10kb region with all contained features'

  - user_query: 'Go to 500kb on U00096'
    tool_call: "navigate_to_position(chromosome='U00096', position=500000)"
    thought: 'The user named the chromosome explicitly, so I copy it verbatim; "500kb" expands to 500000'
    expected_result: 'Browser centers on position 500000 showing 1000bp on each side'

  - user_query: 'Jump to position 1000-2000 of NC_000913.3'
    tool_call: "navigate_to_position(chromosome='NC_000913.3', start=1000, end=2000)"
    thought: 'Both coordinates are given, and the accession is used exactly as the user wrote it'
    expected_result: 'Browser view updates to show the specified region with genes and features'

# Tool relationships and dependencies
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['get_current_state', 'search_features']
  alternatives: ['jump_to_gene']
  prerequisites: []
  follow_up: ['get_sequence', 'search_features']

# Performance and usage statistics
metadata:
  usage_count: 0
  success_rate: 0.0
  avg_execution_time: 0
  last_used: null
  tags: ['core', 'navigation', 'browser', 'essential']
  complexity: 'simple'
  usage_pattern: 'frequent'

# Error handling
error_handling:
  invalid_chromosome: 'Returns an error listing the loaded chromosome names if the requested one is not found; retry with one of those names or omit the parameter'
  invalid_position: 'Returns error if position is outside genome bounds'
  missing_parameters: 'Returns error if required parameters are missing'
  client_error: 'Returns error if browser client is not available'

# Return value specification
returns:
  success: 'boolean - Whether navigation was successful'
  message: 'string - Status message or error description'
  new_position: 'object - New browser position information'
  features_visible: 'array - List of features visible in the new region'
