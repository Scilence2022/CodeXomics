name: open_new_tab
version: 1.0.0
description: 'Open one new analysis tab. Call this tool multiple times when the user explicitly requests multiple tabs.'
category: navigation
keywords:
  - open
  - new
  - tab
  - window
  - parallel
  - analysis
  - compare
  - multiple
  - browser
  - create
priority: 2
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    title:
      type: string
      description: 'Custom title for the new tab. If omitted, the title is generated from the active position.'
    chromosome:
      type: string
      description: 'Chromosome name for the new tab (optional if geneName is provided)'
    start:
      type: number
      description: 'One-based start position (optional if position or geneName is provided)'
    end:
      type: number
      description: 'One-based end position (optional if position or geneName is provided)'
    position:
      type: number
      description: 'Center position; creates a 2000 bp range when start and end are omitted'
    geneName:
      type: string
      description: 'Gene name to search for and focus on in the new tab'
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
  required: []
sample_usages:
  - user_query: 'Open a new tab for comparison'
    tool_call: "open_new_tab(title='Comparison View')"
    thought: 'User wants one new tab inheriting the active genome and view'
    expected_result: 'New analysis tab opens with the requested title and current view'

  - user_query: 'Open five new tabs'
    tool_call: 'Call open_new_tab() five times'
    thought: 'Each call creates one tab, so five explicit calls are required'
    expected_result: 'Five new tabs open and each call reports its own result'

  - user_query: 'Open new tab at position 50000'
    tool_call: "open_new_tab(chromosome='U00096', position=50000)"
    thought: 'User wants new tab starting at specific position'
    expected_result: 'New tab opens showing a 2000 bp region centered on the specified position'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['navigate_to_position', 'jump_to_gene']
  alternatives: []
  prerequisites: []
  follow_up: ['navigate_to_position', 'jump_to_gene']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - navigation
    - tabs
    - ui control
    - workflow
  complexity: simple
  usage_pattern: rare
  recommendation: 'Use for comparative analysis or when you need multiple views'
error_handling:
  client_error: 'Returns error if browser client is not available'
  max_tabs_reached: 'Returns error if maximum tab limit is reached'
returns:
  success: boolean - Whether tab creation was successful
  tab_id: string - Identifier of the newly created tab
  tab_title: string - Title of the new tab
  initial_state: object - Initial state of the new tab
