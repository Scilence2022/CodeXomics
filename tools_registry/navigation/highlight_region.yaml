name: highlight_region
version: 1.0.0
description: >-
  Add a persistent visual highlight (a colored box) over a genomic region, spanning the full
  height of the ruler and tracks. Unlike select_sequence_region (which sets a single active
  selection for copy/extract), this supports MULTIPLE and OVERLAPPING highlights that stay
  visible while panning and zooming. Use when the user asks to "highlight", "mark", or "box"
  a region so it stands out. Each call adds one more highlight; use clear_highlights to remove
  them all or remove_highlight to remove one.
category: navigation
keywords:
  - highlight
  - mark
  - box
  - outline
  - annotate
  - region
  - range
  - emphasize
  - flag
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    chromosome:
      type: string
      description: Chromosome name (optional, defaults to current chromosome)
    start:
      type: number
      description: Start position of the region to highlight (1-based, inclusive). If end is omitted, this single position is highlighted.
      minimum: 1
    end:
      type: number
      description: End position of the region to highlight (1-based, inclusive). If start is omitted, this single position is highlighted.
      minimum: 1
    label:
      type: string
      description: Optional short label shown on the highlight and in the highlights list
    color:
      type: string
      description: >-
        Optional CSS hex color for this highlight (e.g. "#f59e0b"). If omitted, a distinct color
        is auto-assigned from a palette so multiple highlights stay distinguishable.
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
  anyOf:
    - required: ['start']
    - required: ['end']
sample_usages:
  - user_query: Highlight the region from 1000 to 5000
    tool_call: highlight_region(start=1000, end=5000)
    thought: User wants a persistent visual box over a genomic interval
    expected_result: A highlight box is drawn over 1000-5000 and stays visible while navigating
  - user_query: Mark region 200-800 on chromosome 1 in green and label it "operon A"
    tool_call: highlight_region(start=200, end=800, chromosome='1', color='#10b981', label='operon A')
    thought: User wants a colored, labeled highlight on a specific chromosome
    expected_result: A green "operon A" highlight covers 200-800 on chromosome 1
  - user_query: Also highlight 4000-4500
    tool_call: highlight_region(start=4000, end=4500)
    thought: User is adding another highlight; multiple highlights are supported
    expected_result: A second highlight is added without removing the first
  - user_query: Highlight position 311163
    tool_call: highlight_region(start=311163)
    thought: User wants to mark one exact base position
    expected_result: A 1 bp highlight is drawn at position 311163
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['navigate_to_position', 'list_highlights']
  alternatives: ['select_sequence_region']
  prerequisites: []
  follow_up: ['list_highlights', 'remove_highlight', 'clear_highlights']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - navigation
    - highlight
    - annotation
    - visualization
  complexity: simple
  usage_pattern: moderate
  recommendation: 'Use to visually mark one or more regions of interest; repeat to add more highlights'
error_handling:
  invalid_coordinates: 'Returns error if the supplied start or end is not a valid number'
  no_genome_loaded: 'Highlights are drawn once a genome is loaded and the region is in view'
  chromosome_not_found: 'Returns error if specified chromosome does not exist in the loaded genome'
returns:
  success: boolean - Whether the highlight was added
  message: string - Status message
  highlight: object - The stored highlight (id, chromosome, start, end, label, color)
  count: number - Total number of highlights after adding
