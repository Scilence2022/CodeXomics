# find_gene_by_name.yaml
name: 'find_gene_by_name'
aliases: ['find_gene']
version: '1.1.0'
description: "Find the best matching gene name or locus tag across loaded chromosomes. Returns coordinates and strand. Set navigate_to_gene to move the viewport."
category: 'navigation'
keywords: ['find', 'gene', 'name', 'locus', 'tag', 'search', 'locate', 'gene search', 'fallback', 'partial match']
priority: 2 # Lower priority than jump_to_gene

# Tool execution metadata
execution:
  type: 'client'
  timeout: 10000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false

# Input parameters (JSON Schema format)
parameters:
  type: 'object'
  properties:
    name:
      type: 'string'
      description: "Specific gene name or locus tag to search for (e.g., 'lacZ', 'b0062', 'araA'). NOT for functional keywords like 'kinase' or 'transport' — use search_features for those."
      examples: ['lacZ', 'b0062', 'araA', 'dnaA', 'rpoB']
    clientId:
      type: 'string'
      description: 'Browser client ID for multi-window support'
      default: 'default'
    exact_match:
      type: boolean
      description: Require an exact gene name or locus tag.
    case_sensitive:
      type: boolean
      description: Match letter case.
    navigate_to_gene:
      type: boolean
      description: Move the viewport to the best match when true.
    include_annotations:
      type: boolean
      description: Include the feature qualifiers in the best match.
      default: true
  required: ['name']

# High-quality examples for few-shot learning
sample_usages:
  - user_query: "Find the gene named lacZ."
    tool_call: '{"tool_name": "find_gene_by_name", "parameters": {"name": "lacZ"}}'
relationships:
  depends_on: ['get_genome_info']
  conflicts_with: []
  enhances: ['navigate_to_position', 'get_sequence']
  alternatives: ['jump_to_gene'] # jump_to_gene is preferred for direct navigation
  prerequisites: []
  follow_up: ['get_sequence', 'get_coding_sequence']
  recommendation: 'Use jump_to_gene first for direct navigation, use this for fuzzy/partial searches'

# Performance and usage statistics
metadata:
  usage_count: 0
  success_rate: 0.0
  avg_execution_time: 0
  last_used: null
  tags: ['core', 'search', 'gene', 'fallback', 'fuzzy']
  complexity: 'simple'
  usage_pattern: 'occasional' # Less frequent than jump_to_gene
  recommendation: 'Use for specific gene lookup by name/locus tag; for broad searches by annotation/function, use search_features'

# Error handling
error_handling:
  gene_not_found: 'Returns empty result if no genes match the search criteria'
  multiple_matches: 'Returns list of all matching genes with scores'
  invalid_name: 'Returns error if gene name is empty or invalid'
  no_genome_loaded: 'Returns error if no genome is currently loaded'

# Return value specification
returns:
  found: "Whether a matching feature was found."
  chromosome: "Chromosome of the best match."
  feature: "Best matching feature. Qualifiers are included by default."
  genes: "List with coordinates and strand of the best match, or an empty list."
