name: execute_plugin
version: 1.0.0
description: Execute a plugin function with parameters
category: plugin_management
keywords:
  - execute
  - plugin
  - function
  - parameters
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    pluginId:
      type: string
      description: Plugin identifier
    functionName:
      type: string
      description: Function name exposed by the installed plugin
    parameters:
      type: object
      additionalProperties: true
      description: Arguments accepted by the plugin function
  required: [pluginId, functionName]
sample_usages: []
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - plugin_management
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  plugin_not_found: Returns error if plugin not found
  installation_failed: Returns error if installation fails
returns:
  success: boolean - Whether operation was successful
  plugins: array - List of plugins
  count: number - Number of plugins
