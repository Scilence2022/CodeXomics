name: get_coding_sequence
version: 1.0.0
description: "Read the annotated coding sequence for a gene name or locus tag."
category: sequence
keywords:
  - coding sequence
  - gene
  - cds
  - dna
  - extraction
  - nucleotides
priority: 2
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    gene_name:
      type: string
      description: 'Gene name or locus tag to extract coding sequence from'
      examples:
        - 'lacZ'
        - 'dnaA'
        - 'b0062'
        - 'lysC'
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    identifier:
      type: string
      description: Gene name or locus tag (e.g., b0062, araA)
    geneName:
      type: string
      description: Alternative spelling of gene_name.
  required: []
  anyOf:
    - required: [geneName]
    - required: [gene_name]
    - required: [identifier]
sample_usages:
  - user_query: "Read the coding sequence for lacZ."
    tool_call: '{"tool_name": "get_coding_sequence", "parameters": {"gene_name": "lacZ"}}'
relationships:
  depends_on: ['jump_to_gene', 'find_gene_by_name']
  conflicts_with: []
  enhances: ['translate_dna']
  alternatives: ['get_sequence']
  prerequisites: []
  follow_up: ['translate_dna', 'compute_gc']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence
    - gene
    - coding regions
    - extraction
  complexity: simple
  usage_pattern: common
  recommendation: 'Use when you need the actual DNA sequence of a specific gene'
error_handling:
  gene_not_found: 'Returns error if gene name is not found in annotations'
  no_coding_sequence: 'Returns error if gene has no coding sequence'
  invalid_gene_name: 'Returns error if gene name is empty or invalid'
returns:
  codingSequence: "Coding nucleotide sequence."
  geneName: "Matched gene name."
  locusTag: "Matched locus tag."
  length: "Nucleotide length."
