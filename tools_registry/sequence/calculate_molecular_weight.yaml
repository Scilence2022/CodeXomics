name: calculate_molecular_weight
version: 1.1.0
description: 'Calculate the molecular weight of a DNA, RNA, or protein sequence in Daltons. Supports DNA, RNA and Protein sequences with automatic type detection or explicit specification.'
category: sequence
keywords: ['molecular weight', 'molar mass', 'mw', 'daltons', 'mass', 'weight', 'dna', 'protein', 'calculate']
priority: 1
execution:
  type: client
  timeout: 5000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: false
parameters:
  type: object
  properties:
    sequence:
      type: string
      description: 'DNA, RNA, or protein sequence to calculate molecular weight for'
      pattern: '^[A-Za-z*-]+$'
      examples: ['ATGCGCTATCG', 'MSKGPAVGI']
    dna:
      type: string
      description: 'DNA/RNA sequence to calculate molecular weight for (legacy parameter)'
      pattern: '^[ATGCNatgcn]+$'
      examples: ['ATGCGCTATCG', 'ATGAAATAG']
    protein:
      type: string
      description: 'Protein sequence to calculate molecular weight for'
      pattern: '^[ACDEFGHIKLMNPQRSTVWYacdefghiklmnpqrstvwy*]+$'
      examples: ['MSKGPAVGI', 'MGAALR']
    type:
      type: string
      enum: ['dna', 'protein', 'auto']
      description: 'Sequence type: dna, protein, or auto (defaults to auto)'
      default: 'auto'
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
sample_usages:
  - user_query: 'Calculate the molecular weight of this DNA sequence'
    tool_call: "calculate_molecular_weight(sequence='ATGCGCTATCG', type='dna')"
    thought: 'User wants molecular weight calculation for a DNA sequence'
    expected_result: 'Molecular weight in Daltons'

  - user_query: 'What is the molecular weight of this protein sequence: MSKGPAVGI?'
    tool_call: "calculate_molecular_weight(sequence='MSKGPAVGI', type='protein')"
    thought: 'User wants to know the molecular weight of a protein sequence'
    expected_result: 'Molecular weight value of the protein in Daltons'
relationships:
  depends_on: ['get_sequence']
  conflicts_with: []
  enhances: ['translate_dna']
  alternatives: []
  prerequisites: []
  follow_up: ['calculate_melting_temp', 'compute_gc']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence
    - analysis
    - molecular
    - weight
    - mass
  complexity: simple
  usage_pattern: occasional
error_handling:
  empty_sequence: 'Returns 0 if sequence is empty or null'
  invalid_sequence: 'Returns 0 if sequence is not a string'
returns:
  success: 'boolean - Whether calculation was successful'
  molecularWeight: 'number - Molecular weight in Daltons'
  dna: 'string - The analyzed sequence (legacy alias)'
  sequence: 'string - The analyzed sequence'
  length: 'number - Length of the sequence'
