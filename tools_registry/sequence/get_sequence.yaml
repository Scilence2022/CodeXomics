# get_sequence.yaml
name: 'get_sequence'
version: '1.3.0'
description: "Read the nucleotide sequence and length for a genomic interval. Coordinates are 1-based and inclusive."
category: 'sequence'
keywords: ['sequence', 'dna', 'retrieve', 'get', 'extract', 'genomic region', 'nucleotide']
priority: 1

# Tool execution metadata
execution:
  type: 'client'
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false

# Input parameters (JSON Schema format)
parameters:
  type: 'object'
  properties:
    chromosome:
      type: 'string'
      description: 'Chromosome/contig name exactly as loaded (see the loaded names in the current context, or call get_chromosome_list). Omit to use the chromosome currently displayed.'
      examples: ['U00096', 'NC_000913.3']
    start:
      type: 'number'
      description: 'Start position in base pairs (1-based coordinate)'
      minimum: 1
      examples: [1000, 50000, 1000000]
    end:
      type: 'number'
      description: 'End position in base pairs (1-based coordinate)'
      minimum: 1
      examples: [2000, 60000, 1002000]
    clientId:
      type: 'string'
      description: 'Browser client ID for multi-window support'
      default: 'default'
    strand:
      type: string
      description: Return forward (+), reverse-complement (-), or forward sequence plus reverseComplement (both).
      enum:
      - +
      - '-'
      - both
      default: +
  required: ['start', 'end']

# High-quality examples for few-shot learning
sample_usages:
  - user_query: "Read positions 1 through 10 on the current chromosome."
    tool_call: '{"tool_name": "get_sequence", "parameters": {"start": 1, "end": 10}}'
relationships:
  depends_on: ['navigate_to_position']
  conflicts_with: []
  enhances: ['compute_gc', 'translate_dna', 'search_sequence_motif']
  alternatives: ['get_coding_sequence']
  prerequisites: []
  follow_up: ['compute_gc', 'translate_dna', 'reverse_complement']

# Performance and usage statistics
metadata:
  usage_count: 0
  success_rate: 0.0
  avg_execution_time: 0
  last_used: null
  tags: ['core', 'sequence', 'dna', 'essential']
  complexity: 'simple'
  usage_pattern: 'frequent'

# Error handling
error_handling:
  invalid_region: 'Returns error if start > end or region is invalid'
  chromosome_not_found: 'Returns error if chromosome not found in loaded genome'
  position_out_of_bounds: 'Returns error if positions exceed genome length'

# Return value specification
returns:
  sequence: "Sequence in the requested orientation."
  reverseComplement: "Reverse-complemented sequence when strand is both."
  length: "Number of returned bases."
  chromosome: "Chromosome name."
  start: "Start coordinate."
  end: "End coordinate."
