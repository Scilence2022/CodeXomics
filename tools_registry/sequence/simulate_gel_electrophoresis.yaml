name: 'simulate_gel_electrophoresis'
description: 'Simulate agarose gel electrophoresis to visualize restriction digest fragments. Renders DNA bands on a virtual gel. This is a visualization-only tool — it does NOT perform digestion. Call virtual_digest first and pass its fragmentDetails to this tool.'
parameters:
  type: 'object'
  properties:
    fragments:
      type: 'array'
      items:
        type: 'object'
      description: 'Fragment details from virtual_digest result (array of objects with length property, or array of integers). REQUIRED. Obtain from virtual_digest output: result.fragmentDetails'
    gelPercentage:
      type: 'number'
      description: 'Agarose gel percentage (0.5-3.0). Lower % for large fragments, higher % for small fragments. Default 1.0.'
      default: 1.0
    ladderType:
      type: 'string'
      enum: ['1kb', '100bp', '2log', 'lambda_hindiii', 'lambda_ecori']
      description: 'DNA ladder/marker type for size reference. Default 1kb.'
      default: '1kb'
    laneLabel:
      type: 'string'
      description: 'Label for the sample lane (e.g. "EcoRI + HindIII digest").'
    voltage:
      type: 'number'
      description: 'Electrophoresis voltage in volts (default 100).'
      default: 100
    runTime:
      type: 'number'
      description: 'Run time in minutes (default 45).'
      default: 45
    showLadder:
      type: 'boolean'
      description: 'Whether to show the DNA size ladder/marker lane (default true).'
      default: true
    bandColorScheme:
      type: 'string'
      enum: ['ethidium_bromide', 'gel_red', 'sybr_safe', 'methylene_blue', 'uv_default']
      description: 'Band staining color scheme. ethidium_bromide=orange/red (default), gel_red=red, sybr_safe=green, methylene_blue=blue, uv_default=violet.'
      default: 'ethidium_bromide'
  required:
    - 'fragments'
keywords:
  - 'gel electrophoresis'
  - 'gel image'
  - 'run gel'
  - 'agarose gel'
  - 'gel simulation'
  - 'gel visualization'
  - 'fragment gel'
  - 'dna gel'
  - 'band pattern'
  - 'electrophoresis'
sample_usages:
  - 'Visualize digest fragments on a 1% agarose gel with 1kb ladder.'
  - 'Simulate a 1.5% agarose gel with 100bp ladder and SYBR Safe stain.'
  - 'Run a 0.8% gel for large fragments with lambda HindIII ladder.'
relationships:
  enhances:
    - 'virtual_digest'
    - 'find_restriction_sites'
  prerequisites:
    - 'virtual_digest'
  follow_up:
    - 'export_data'
