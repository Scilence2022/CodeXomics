name: 'simulate_gel_electrophoresis'
description: 'Simulate agarose gel electrophoresis to visualize restriction digest fragments. Renders DNA bands on a virtual gel based on fragment sizes from a virtual_digest result. Supports configurable gel percentage, DNA ladders, and realistic band migration physics.'
parameters:
  type: 'object'
  properties:
    fragments:
      type: 'array'
      items:
        type: 'object'
      description: 'Fragment details from virtual_digest result (array of objects with length property, or array of integers). If omitted, runs virtual_digest first with the provided enzymes.'
    enzymes:
      type: 'array'
      items:
        type: 'string'
      description: 'Restriction enzyme names to digest with (used when fragments not provided, or for labeling).'
    gelPercentage:
      type: 'number'
      description: 'Agarose gel percentage (0.5-3.0). Lower % for large fragments, higher % for small fragments. Default 1.0.'
      default: 1.0
    ladderType:
      type: 'string'
      enum: ['1kb', '100bp', '2log', 'lambda_hindiii', 'lambda_ecori']
      description: 'DNA ladder type for size reference. Default 1kb.'
      default: '1kb'
    chromosome:
      type: 'string'
      description: 'Chromosome name (defaults to current chromosome).'
    voltage:
      type: 'number'
      description: 'Electrophoresis voltage in volts (default 100).'
      default: 100
    runTime:
      type: 'number'
      description: 'Run time in minutes (default 45).'
      default: 45
    showLadder:
      type: 'boolean'
      description: 'Whether to show the DNA size ladder lane (default true).'
      default: true
    label:
      type: 'string'
      description: 'Custom label for the digest lane.'
  required:
    - 'enzymes'
keywords:
  - 'gel electrophoresis'
  - 'gel image'
  - 'run gel'
  - 'agarose gel'
  - 'gel simulation'
  - 'gel visualization'
  - 'fragment gel'
  - 'dna gel'
  - 'band pattern'
  - 'electrophoresis'
sample_usages:
  - 'Run gel electrophoresis with EcoRI and HindIII digest fragments.'
  - 'Simulate a 1.5% agarose gel for BamHI digest.'
  - 'Show gel image for the virtual digest with EcoRI, using 100bp ladder.'
  - 'Run a 0.8% gel for large fragments from NotI digest.'
relationships:
  enhances:
    - 'virtual_digest'
    - 'find_restriction_sites'
  prerequisites:
    - 'virtual_digest'
  follow_up:
    - 'export_data'
