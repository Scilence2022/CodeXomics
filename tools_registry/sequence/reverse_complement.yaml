name: reverse_complement
version: 1.1.0
description: 'Generate the reverse complement of a DNA sequence. Reverses the sequence order and converts each base to its complement (A↔T, G↔C).'
category: sequence
keywords: ['reverse', 'complement', 'dna', 'sequence', 'strand', 'antisense']
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    sequence:
      type: string
      description: 'DNA sequence to reverse complement (supports IUPAC ambiguity codes).'
      examples: ['ATGCGCTATCG', 'TTAGCATGCGC', 'AAATTTGGGCCC']
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
    dna:
      type: string
      description: DNA sequence
    validate_sequence:
      type: boolean
      description: Validate IUPAC DNA symbols before conversion.
      default: false
    preserve_case:
      type: boolean
      description: Preserve the case of the input bases.
      default: true
  required: []
  anyOf:
    - required: [sequence]
    - required: [dna]
sample_usages:
  - user_query: "Reverse complement this sequence."
    tool_call: '{"tool_name": "reverse_complement", "parameters": {"sequence": "ACGT"}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_sequence: Returns error if sequence is invalid
  empty_sequence: Returns error if sequence is empty
returns:
  reverseComplement: "Reverse-complemented DNA. MCP wraps the string in reverseComplement. ChatBox can return the string directly."
