name: translate_dna
version: 1.2.0
description: 'Translate a DNA or RNA sequence to an amino acid sequence. Supports the three forward reading frames and the NCBI genetic code tables (standard, bacterial, mitochondrial, Mycoplasma and others).'
category: sequence
keywords: ['translate', 'dna', 'protein', 'amino acid', 'genetic code', 'orf']
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    dna:
      type: string
      description: 'DNA or RNA sequence to translate (must be multiple of 3 for complete translation). IUPAC ambiguity codes are accepted; a codon such as GCN that encodes one residue whatever N is translates to that residue, any other ambiguous codon to X.'
      pattern: '^[ACGTUNRYSWKMBDHVacgtunryswkmbdhv]+$'
      examples: ['ATGCGCTATCGAAAG', 'TTGAAATAG', 'ATGAAAAAATAG']
    reading_frame:
      type: number
      enum: [1, 2, 3]
      description: 'Reading frame to use (1, 2, or 3)'
      default: 1
    genetic_code:
      type: string
      description: 'Genetic code: an NCBI translation table id ("1", "4", "11") or a name (standard, bacterial, archaeal, vertebrate_mitochondrial, yeast_mitochondrial, invertebrate_mitochondrial, mycoplasma, ciliate, candidate_division_sr1). Use the /transl_table of the genome when it is known. An unknown code is rejected rather than replaced by the standard code.'
      examples: ['standard', 'bacterial', 'vertebrate_mitochondrial', '4']
      default: 'standard'
    include_stop_codons:
      type: boolean
      description: 'true (default): translate the whole frame and write each stop codon as *. false: stop at the first stop codon and leave it out.'
      default: true
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
  required: ['dna']
sample_usages:
  - user_query: 'Translate this DNA sequence to protein'
    tool_call: "translate_dna(dna='ATGCGCTATCGAAAG', reading_frame=1)"
    thought: 'User wants to translate a DNA sequence starting from reading frame 1'
    expected_result: 'Amino acid sequence: MRYRK (with start and stop codons if present)'

  - user_query: 'Translate using mitochondrial genetic code'
    tool_call: "translate_dna(dna='ATGAAAAAATAG', genetic_code='vertebrate_mitochondrial', include_stop_codons=false)"
    thought: 'User wants translation using mitochondrial code without stop codons'
    expected_result: 'Amino acid sequence using mitochondrial genetic code table'

  - user_query: 'Translate this Mycoplasma gene'
    tool_call: "translate_dna(dna='ATGTGAAAATAA', genetic_code='mycoplasma')"
    thought: 'Mycoplasma reads TGA as tryptophan (NCBI table 4), so the standard code would stop too early'
    expected_result: 'MWK* (TGA translated as W)'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_sequence: Returns error if sequence is invalid
  empty_sequence: Returns error if sequence is empty
returns:
  success: 'boolean - Whether translation was successful'
  original_sequence: 'string - Original DNA sequence'
  amino_acid_sequence: 'string - Translated amino acid sequence'
  reading_frame: 'number - Reading frame used for translation'
  genetic_code_used: 'string - Genetic code table used'
  sequence_length: 'number - Length of DNA sequence'
  protein_length: 'number - Length of resulting protein sequence'
