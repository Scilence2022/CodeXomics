# compute_gc.yaml
name: 'compute_gc'
version: '1.2.0'
description: "Calculate GC content for one supplied nucleotide sequence."
category: 'sequence'
keywords: ['gc', 'content', 'calculate', 'composition', 'nucleotide', 'statistics', 'analysis']
priority: 1

# Tool execution metadata
execution:
  type: 'client'
  timeout: 5000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: false

# Input parameters (JSON Schema format)
parameters:
  type: 'object'
  properties:
    sequence:
      type: 'string'
      description: 'DNA sequence to analyze (A, T, C, G, N allowed)'
      examples: ['ATGCGCTATCG', 'ATGAAATAG', 'NNNNATGCGCTATCGNNNN']
    clientId:
      type: 'string'
      description: 'Browser client ID for multi-window support'
      default: 'default'
  required: ['sequence']

# High-quality examples for few-shot learning
sample_usages:
  - user_query: "Compute the GC percentage of this sequence."
    tool_call: '{"tool_name": "compute_gc", "parameters": {"sequence": "ACGT"}}'
relationships:
  depends_on: ['get_sequence']
  conflicts_with: []
  enhances: ['calc_region_gc']
  alternatives: ['calc_region_gc']
  prerequisites: []
  follow_up: ['translate_dna', 'predict_promoter']

# Performance and usage statistics
metadata:
  usage_count: 0
  success_rate: 0.0
  avg_execution_time: 0
  last_used: null
  tags: ['core', 'analysis', 'gc', 'composition']
  complexity: 'simple'
  usage_pattern: 'common'

# Error handling
error_handling:
  empty_sequence: 'Returns error if sequence is empty or null'

# Return value specification
returns:
  gcContent: "GC percentage using A, C, G and T as the denominator. MCP returns the formatted percentage in gcContent. ChatBox can return the numeric value directly or in value."
