# CodeXomics Tool Categories
# Defines the hierarchical organization of all tools

categories:
  file_loading:
    name: 'File Loading Operations'
    description: 'Built-in tools for loading genomic files directly with path specification or file dialogs'
    icon: '📁'
    priority: 1
    color: '#FF6B35'
    subcategories:
      - 'genome_loading'
      - 'annotation_loading'
      - 'variant_loading'
      - 'reads_loading'
      - 'tracks_loading'
      - 'operon_loading'
    tools_count: 6

  navigation:
    name: 'Navigation & State Management'
    description: 'Tools for genome browser navigation, state management, and track control'
    icon: '🧭'
    priority: 1
    color: '#4CAF50'
    subcategories:
      - 'browser_navigation'
      - 'state_management'
      - 'track_control'
    tools_count: 33

  sequence:
    name: 'Sequence Analysis'
    description: 'Tools for DNA/RNA sequence analysis, motif searching, and basic bioinformatics'
    icon: '🧬'
    priority: 1
    color: '#2196F3'
    subcategories:
      - 'sequence_retrieval'
      - 'sequence_analysis'
      - 'motif_search'
      - 'prediction'
    tools_count: 8

  protein:
    name: 'Protein Structure'
    description: 'Tools for protein structure analysis, PDB searches, and AlphaFold integration'
    icon: '🔬'
    priority: 1
    color: '#FF9800'
    subcategories:
      - 'structure_retrieval'
      - 'structure_visualization'
      - 'alphafold_integration'
      - 'pdb_search'
    tools_count: 6

  database:
    name: 'Database Integration'
    description: 'Tools for accessing biological databases (UniProt, InterPro, etc.)'
    icon: '🗄️'
    priority: 2
    color: '#9C27B0'
    subcategories:
      - 'uniprot_search'
      - 'interpro_analysis'
      - 'database_queries'
      - 'cross_references'
    tools_count: 6

  data_management:
    name: 'Data Management'
    description: 'Tools for data annotation, export, and codon usage analysis'
    icon: '📊'
    priority: 2
    color: '#607D8B'
    subcategories:
      - 'annotation_management'
      - 'data_export'
      - 'codon_analysis'
      - 'region_analysis'
    tools_count: 3

  annotation:
    name: 'Annotation Management'
    description: 'CRUD operations for genome annotations with full-text search and change tracking for AI agent integration'
    icon: '🏷️'
    priority: 1
    color: '#8E24AA'
    subcategories:
      - 'annotation_crud'
      - 'annotation_search'
      - 'change_tracking'
      - 'operon_analysis'
    tools_count: 10

  file_operations:
    name: 'File Operations'
    description: 'Tools for file input/output operations including data export and file format conversion'
    icon: '💾'
    priority: 2
    color: '#FF6B35'
    subcategories:
      - 'export'
      - 'import'
      - 'conversion'
      - 'validation'
    tools_count: 9

  pathway:
    name: 'Pathway & BLAST'
    description: 'Tools for metabolic pathway visualization and BLAST sequence searches'
    icon: '🔄'
    priority: 2
    color: '#795548'
    subcategories:
      - 'pathway_visualization'
      - 'blast_search'
      - 'metabolic_analysis'
    tools_count: 3

  sequence_editing:
    name: 'Sequence Editing'
    description: 'Tools for sequence manipulation, editing, and action management'
    icon: '✏️'
    priority: 1
    color: '#FF5722'
    subcategories:
      - 'sequence_manipulation'
      - 'action_management'
      - 'clipboard_operations'
    tools_count: 10

  primer_design:
    name: 'Primer Design & PCR'
    description: 'Tools for designing sequence primers, checking thermodynamic properties (Tm, GC), and mapping binding sites.'
    icon: '🧬'
    priority: 1
    color: '#9C27B0'
    subcategories:
      - 'design'
      - 'analysis'
      - 'mapping'
    tools_count: 4

  system:
    name: 'System Management'
    description: 'Tools for system operations, interface controls, working directory management, and environment setup'
    icon: '⚙️'
    priority: 1
    color: '#795548'
    subcategories:
      - 'directory_management'
      - 'environment_setup'
      - 'system_configuration'
      - 'interface_controls'
    tools_count: 11

  benchmark:
    name: 'Benchmark Management'
    description: 'Tools for running, controlling, and inspecting LLM benchmark tests'
    icon: '📈'
    priority: 2
    color: '#00ACC1'
    subcategories:
      - 'benchmark_control'
      - 'benchmark_results'
    tools_count: 8

  plugin_management:
    name: 'Plugin Management'
    description: 'Tools for plugin installation, execution, and development'
    icon: '🔌'
    priority: 3
    color: '#3F51B5'
    subcategories:
      - 'plugin_installation'
      - 'plugin_execution'
      - 'plugin_development'
      - 'plugin_marketplace'
    tools_count: 12

  coordination:
    name: 'Multi-Agent Coordination'
    description: 'Tools for coordinating multiple AI agents and workflow management'
    icon: '🎯'
    priority: 2
    color: '#00BCD4'
    subcategories:
      - 'task_coordination'
      - 'workflow_management'
      - 'agent_management'
      - 'error_recovery'
    tools_count: 15

  external_apis:
    name: 'External API Integration'
    description: 'Tools for integrating with external biological databases and APIs'
    icon: '🌐'
    priority: 2
    color: '#8BC34A'
    subcategories:
      - 'blast_apis'
      - 'uniprot_apis'
      - 'alphafold_apis'
    tools_count: 11

  utility:
    name: 'Utility Tools'
    description: 'General utility tools for file downloads, document viewing, and other helper functions'
    icon: '🛠️'
    priority: 2
    color: '#78909C'
    subcategories:
      - 'file_download'
      - 'document_viewer'
      - 'helper_functions'
    tools_count: 2

  task_management:
    name: 'Task Management'
    description: 'Tools for setting, updating, and tracking task lists during complex workflow execution'
    icon: '🎯'
    priority: 1
    color: '#3b82f6'
    subcategories:
      - 'task_tracking'
    tools_count: 5

# Tool priority levels
priority_levels:
  1: 'Critical - Core functionality tools'
  2: 'Important - Enhanced functionality tools'
  3: 'Optional - Specialized or advanced tools'

# Tool execution types
execution_types:
  client: 'Executed in the browser/client'
  server: 'Executed on the server'
  hybrid: 'Combines client and server execution'

# Tool relationship types
relationship_types:
  depends_on: 'This tool requires another tool to function'
  conflicts_with: 'This tool cannot be used with another tool'
  enhances: "This tool improves another tool's functionality"
  alternatives: 'This tool can be used instead of another tool'
  prerequisites: 'This tool should be used before another tool'
  follow_up: 'This tool is commonly used after another tool'

# Usage patterns
usage_patterns:
  frequent: 'Used in >50% of sessions'
  common: 'Used in 20-50% of sessions'
  occasional: 'Used in 5-20% of sessions'
  rare: 'Used in <5% of sessions'

# Tool complexity levels
complexity_levels:
  simple: 'Single operation, minimal parameters'
  moderate: 'Multiple operations, several parameters'
  complex: 'Complex workflows, many parameters'
  expert: 'Advanced functionality, requires expertise'

# Integration requirements
integration_requirements:
  none: 'No special requirements'
  auth: 'Requires authentication'
  network: 'Requires network connection'
  data: 'Requires loaded genome data'
  plugin: 'Requires specific plugin'
  api_key: 'Requires API key'
