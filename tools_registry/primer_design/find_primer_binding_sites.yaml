name: find_primer_binding_sites
version: 1.0.0
description: 'Search for binding sites of a specific primer sequence within a larger template. Finds both forward and reverse occurrences.'
category: primer_design
keywords:
  - primer
  - binding
  - find binding sites
  - template sequence
  - primer binding
  - primer sequence
  - map primer
  - mismatch
  - search primer
  - specificity
priority: 1
subcategory: mapping
execution_type: hybrid
complexity: simple
tags:
  - primer
  - mapping
  - binding
parameters:
  type: object
  properties:
    sequence:
      type: string
      description: 'The short primer DNA sequence to search for (e.g. GCAATATGTCTCTGTGTGGAT).'
    primerSequence:
      type: string
      description: 'Alias for sequence. The short primer DNA sequence.'
    templateSequence:
      type: string
      description: 'Optional. The larger template DNA sequence to search within. If not provided, the tool will automatically search the current active genome or chromosome.'
    maxMismatches:
      type: number
      description: 'Maximum number of mismatched bases allowed (default: 0)'
  required: []
