name: find_primer_binding_sites
description: "Search for binding sites of a specific primer sequence within a larger template. Finds both forward and reverse occurrences."
category: primer_design
subcategory: mapping
execution_type: hybrid
priority: 1
complexity: simple
tags:
  - primer
  - mapping
  - binding
parameters:
  type: object
  properties:
    primerSequence:
      type: string
      description: "The short primer DNA sequence"
    templateSequence:
      type: string
      description: "The larger template DNA sequence to search within."
    maxMismatches:
      type: number
      description: "Maximum number of mismatched bases allowed (default: 0)"
  required:
    - primerSequence
    - templateSequence