name: save_primer
aliases:
  - add_primer_annotation
version: 1.1.0
description: 'Save one primer oligo to the primer library and pin its genomic binding site. For a designed pair, call once per primer with target.chromosome and the corresponding genomicStart, genomicEnd, strand, and sequence from design_primers.'
category: primer_design
keywords:
  - add primer
  - primer annotation
  - primer track
  - annotation
  - visualization
  - track
  - display primer
priority: 1
subcategory: display
execution_type: client
complexity: moderate
tags:
  - primer
  - visualization
  - annotation
parameters:
  type: object
  properties:
    name:
      type: string
      description: 'Name of the primer (e.g., Fwd_1)'
    chromosome:
      type: string
      description: 'Chromosome/replicon ID where the primer binds'
    start:
      type: number
      description: 'Lower 1-based genomic coordinate, inclusive. For a designed primer, use genomicStart.'
    end:
      type: number
      description: 'Higher 1-based genomic coordinate, inclusive. For a designed primer, use genomicEnd.'
    strand:
      type: string
      description: 'Strand (+ or -)'
    description:
      type: string
      description: 'Optional description or properties'
    sequence:
      type: string
      description: 'Optional primer oligo sequence. Use this when the primer intentionally differs from the genomic binding window.'
    primerSequence:
      type: string
      description: 'Alias for sequence.'
  required:
    - name
    - chromosome
    - start
    - end
