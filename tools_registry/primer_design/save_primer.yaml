name: save_primer
aliases:
  - add_primer_annotation
version: 1.1.0
description: 'Save a primer oligo to the primer library (stored separately from the genome, never written into the genome file). Binding sites are predicted automatically; provide chromosome/start/end only to pin a specific manual placement.'
category: primer_design
keywords:
  - add primer
  - primer annotation
  - primer track
  - annotation
  - visualization
  - track
  - display primer
priority: 1
subcategory: display
execution_type: client
complexity: moderate
tags:
  - primer
  - visualization
  - annotation
parameters:
  type: object
  properties:
    name:
      type: string
      description: 'Name of the primer (e.g., Fwd_1)'
    chromosome:
      type: string
      description: 'Chromosome/replicon ID where the primer binds'
    start:
      type: number
      description: "Start position (5' end)"
    end:
      type: number
      description: "End position (3' end)"
    strand:
      type: string
      description: 'Strand (+ or -)'
    description:
      type: string
      description: 'Optional description or properties'
    sequence:
      type: string
      description: 'Optional primer oligo sequence. Use this when the primer intentionally differs from the genomic binding window.'
    primerSequence:
      type: string
      description: 'Alias for sequence.'
  required:
    - name
    - chromosome
    - start
    - end
