name: delete_primers
aliases:
  - clear_primer_annotations
version: 1.1.0
description: 'Delete primers from the library. Requires confirm=true. Optionally scope to one chromosome to remove only pinned placements there.'
category: primer_design
subcategory: display
keywords:
  - primer
  - primers
  - clear primers
  - remove primers
  - primer annotations
  - primer track
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
execution_type: client
priority: 1
complexity: moderate
tags:
  - primer
  - visualization
  - annotation
parameters:
  type: object
  properties:
    chromosome:
      type: string
      description: 'Optional chromosome/replicon ID. If omitted, clears primer annotations from all chromosomes.'
    confirm:
      type: boolean
      description: 'Must be true to clear primer annotations.'
  required:
    - confirm
sample_usages:
  - user_query: 'Delete all primers'
    tool_call: 'delete_primers(confirm=true)'
    thought: 'User wants to remove all primers from the library'
    expected_result: 'All primers are removed from the library'
  - user_query: 'Remove pinned primers on chr1'
    tool_call: "delete_primers(chromosome='chr1', confirm=true)"
    thought: 'User wants to remove pinned placements on one chromosome'
    expected_result: 'Pinned primer placements on chr1 are removed'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['list_primers']
  alternatives: []
  prerequisites: ['list_primers']
  follow_up: ['list_primers']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - primer
    - visualization
    - annotation
  complexity: moderate
  usage_pattern: occasional
  recommendation: 'Use only when the user explicitly asks to remove primer visualizations'
error_handling:
  missing_confirm: 'Returns error unless confirm=true'
returns:
  success: boolean
  removed: number
  chromosome: string
