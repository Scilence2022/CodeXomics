name: list_primers
aliases:
  - list_primer_annotations
version: 1.1.0
description: 'List primers in the library and their binding sites (pinned + predicted) for the current chromosome, optionally filtered by genomic interval.'
category: primer_design
subcategory: display
keywords:
  - primer
  - primers
  - list primers
  - primer annotations
  - primer track
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
execution_type: client
priority: 1
complexity: simple
tags:
  - primer
  - visualization
  - annotation
parameters:
  type: object
  properties:
    chromosome:
      type: string
      description: 'Optional chromosome/replicon ID to filter primers, named exactly as loaded (see the loaded names in the current context). Omit to use the current chromosome.'
    start:
      type: number
      description: 'Optional interval start position'
    end:
      type: number
      description: 'Optional interval end position'
  required: []
sample_usages:
  - user_query: 'List primers on the current genome'
    tool_call: 'list_primers()'
    thought: 'User wants to inspect primers in the library and their binding sites'
    expected_result: 'Primers are returned with pinned + predicted binding sites'
  - user_query: 'Show primers on U00096 between 1000 and 2000'
    tool_call: "list_primers(chromosome='U00096', start=1000, end=2000)"
    thought: 'User wants primers filtered to a region'
    expected_result: 'Only primers with sites overlapping U00096:1000-2000 are returned'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['save_primer', 'toggle_track']
  alternatives: []
  prerequisites: []
  follow_up: ['save_primer', 'delete_primers']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - primer
    - visualization
    - annotation
  complexity: simple
  usage_pattern: common
  recommendation: 'Use to inspect currently displayed primer visualizations'
returns:
  success: boolean
  count: number
  primers: array
