name: list_primers
aliases:
  - list_primer_annotations
version: 2.0.0
description: 'List each saved primer once, including primers without binding sites. Sites are grouped under each primer for the selected chromosome. Interval bounds restrict the result to primers with overlapping sites.'
category: primer_design
subcategory: display
keywords:
  - primer
  - primers
  - list primers
  - primer annotations
  - primer track
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
execution_type: client
priority: 1
complexity: simple
tags:
  - primer
  - visualization
  - annotation
parameters:
  type: object
  properties:
    chromosome:
      type: string
      description: 'Chromosome/replicon ID for the binding sites, named exactly as loaded. Omit to use the current chromosome.'
    start:
      type: number
      description: 'Optional interval start position'
    end:
      type: number
      description: 'Optional interval end position'
  required: []
sample_usages:
  - user_query: 'List primers on the current genome'
    tool_call: 'list_primers()'
    thought: 'User wants to inspect primers in the library and their binding sites'
    expected_result: 'All saved primers are returned once with their available pinned and predicted sites'
  - user_query: 'Show primers on U00096 between 1000 and 2000'
    tool_call: "list_primers(chromosome='U00096', start=1000, end=2000)"
    thought: 'User wants primers filtered to a region'
    expected_result: 'Only primers with sites overlapping U00096:1000-2000 are returned'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['save_primer', 'toggle_track']
  alternatives: []
  prerequisites: []
  follow_up: ['save_primer', 'delete_primers']
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - primer
    - visualization
    - annotation
  complexity: simple
  usage_pattern: common
  recommendation: 'Use to inspect currently displayed primer visualizations'
returns:
  success: boolean
  chromosome: string
  count: number
  primers: array
