# search_alphafold_structures.yaml (formerly search_alphafold_by_gene)
name: 'search_alphafold_structures'
version: '1.4.0'
description: 'Search AlphaFold database for protein structures by gene name. Returns predicted 3D structures with confidence scores and metadata.'
category: 'protein'
keywords: ['alphafold', 'protein', 'structure', '3d', 'prediction', 'gene', 'search', 'uniprot']
priority: 1

# Tool execution metadata
execution:
  type: 'built-in'
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: false

# Input parameters (JSON Schema format)
parameters:
  type: 'object'
  properties:
    geneName:
      type: 'string'
      description: "Gene name to search for (e.g., 'p53', 'lacZ', 'dnaA')"
      examples: ['p53', 'lacZ', 'dnaA', 'rpoB', 'recA']
    organism:
      type: 'string'
      description: "Organism name for more specific search (e.g., 'Homo sapiens', 'Escherichia coli')"
      default: 'Escherichia coli'
      examples: ['Homo sapiens', 'Escherichia coli', 'Saccharomyces cerevisiae', 'Mus musculus']
    maxResults:
      type: 'number'
      description: 'Maximum number of results to return'
      default: 10
      minimum: 1
      maximum: 50
    clientId:
      type: 'string'
      description: 'Browser client ID for multi-window support'
      default: 'default'
  required: ['geneName']

# High-quality examples for few-shot learning
sample_usages:
  - user_query: "Find up to five AlphaFold structures for lacZ."
    tool_call: '{"tool_name": "search_alphafold_structures", "parameters": {"geneName": "lacZ", "maxResults": 5}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['open_protein_viewer', 'fetch_alphafold_structure']
  alternatives: []
  prerequisites: []
  follow_up: ['open_protein_viewer', 'fetch_alphafold_structure', 'analyze_interpro_domains']

# Performance and usage statistics
metadata:
  usage_count: 0
  success_rate: 0.0
  avg_execution_time: 0
  last_used: null
  tags: ['protein', 'structure', 'alphafold', 'prediction']
  complexity: 'moderate'
  usage_pattern: 'common'

# Error handling
error_handling:
  gene_not_found: 'Returns empty result if no structures found for the gene'
  network_error: 'Returns error if AlphaFold API is unavailable'
  invalid_organism: 'Returns error if organism name is invalid'
  api_limit_exceeded: 'Returns error if API rate limit is exceeded'

# Return value specification
returns:
  count: "Number of returned structures."
  results: "Matching AlphaFold structures."
