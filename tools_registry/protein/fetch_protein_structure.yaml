name: fetch_protein_structure
version: 1.1.0
description: "Fetch and cache a structure by PDB ID or UniProt accession. Use search_pdb_structures to find an ID from a gene name."
category: protein
keywords: ['fetch', 'download', 'protein', 'structure', 'pdb', 'experimental', 'crystallography']
priority: 1
execution:
  type: server
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    pdb_id:
      type: string
      description: "PDB ID for the structure (e.g., '1TUP', '2BEG', '4HHB')"
      pattern: '^[0-9][A-Za-z0-9]{3}$'
      examples: ['1TUP', '2BEG', '4HHB', '1LMB']
    geneName:
      type: string
      description: 'Optional gene label for a UniProt accession.'
      examples: ['p53', 'lacZ', 'dnaA', 'hemoglobin']
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
    pdbId:
      type: string
      description: Direct PDB ID (alternative to gene name)
    uniprotId:
      type: string
      description: UniProt accession for an AlphaFold model.
    include_ligands:
      type: boolean
      description: PDB downloads include all deposited ligands. Only true is supported.
      enum:
      - true
      default: true
    uniprot_id:
      type: string
      description: Alternative spelling of uniprotId.
  required: []
  anyOf:
    - required: [uniprot_id]
    - required: [pdb_id]
    - required: [pdbId]
    - required: [uniprotId]
sample_usages:
  - user_query: "Fetch the PDB structure 1TUP."
    tool_call: '{"tool_name": "fetch_protein_structure", "parameters": {"pdb_id": "1TUP"}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - protein
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  gene_not_found: Returns error if gene not found
  structure_not_found: Returns error if structure not found
returns:
  _dataRef: "Cached structure reference for open_protein_viewer when caching is available."
  downloadUrl: "Source structure URL."
