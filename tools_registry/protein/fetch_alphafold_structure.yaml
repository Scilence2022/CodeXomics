name: fetch_alphafold_structure
version: 1.2.0
description: 'Download and cache the current AlphaFold protein structure selected from official prediction metadata by UniProt ID or gene name. PDB confidence values are returned per residue and remain embedded in the PDB B-factor column.'
category: protein
keywords: ['fetch', 'download', 'alphafold', 'structure', 'uniprot', 'pdb', 'cache']
priority: 1
execution:
  type: built-in
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    uniprot_id:
      type: string
      description: "UniProt ID for the protein (e.g., 'P04637', 'P00350')"
      pattern: '^[A-Z0-9]{6,10}$'
      examples: ['P04637', 'P00350', 'P0A7B8']
    geneName:
      type: string
      description: "Gene name as alternative to UniProt ID (e.g., 'p53', 'lacZ')"
      examples: ['p53', 'lacZ', 'dnaA', 'rpoB']
    organism:
      type: string
      description: 'Organism name for gene name resolution'
      default: 'Homo sapiens'
      examples: ['Homo sapiens', 'Escherichia coli', 'Mus musculus']
    format:
      type: string
      enum: ['pdb', 'cif']
      description: 'Structure file format to download'
      default: 'pdb'
    include_confidence:
      type: boolean
      description: 'Include per-residue confidence scores'
      default: true
    cache_locally:
      type: boolean
      description: 'Cache structure file locally for faster access'
      default: true
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
  required: []
sample_usages:
  - user_query: 'Download p53 structure from AlphaFold'
    tool_call: "fetch_alphafold_structure(uniprot_id='P04637', format='pdb')"
    thought: 'User wants to download the p53 protein structure file'
    expected_result: 'Downloaded PDB file with p53 structure and confidence data'

  - user_query: 'Get lacZ structure for E. coli'
    tool_call: "fetch_alphafold_structure(geneName='lacZ', organism='Escherichia coli', include_confidence=true)"
    thought: 'User wants lacZ structure from E. coli with confidence scores'
    expected_result: 'lacZ structure file with per-residue confidence information'

relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - protein
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  gene_not_found: Returns error if gene not found
  structure_not_found: Returns error if structure not found
returns:
  success: 'boolean - Whether structure download was successful'
  structureFile: 'string - Path to the temporary local structure file when cache_locally is enabled and file caching is available'
  uniprotId: 'string - UniProt ID of the protein'
  structureId: 'string - AlphaFold model entity identifier'
  modelVersion: 'number - Current AlphaFold model version reported by prediction metadata'
  modelCreatedDate: 'string - Model creation date reported by AlphaFold'
  globalMetricValue: 'number - AlphaFold global confidence metric when available'
  format: 'string - Downloaded file format (pdb/cif)'
  dataLength: 'number - Size of structure data in characters'
  _dataRef: 'string - In-memory cache reference that can be passed to open_protein_viewer as data_ref'
  confidence: 'object - Summary pLDDT statistics (if requested)'
  confidenceScores: 'array - Per-residue pLDDT confidence scores from PDB alpha-carbon B-factors (if requested)'
  confidenceLocation: 'string - Location of confidence values in the downloaded PDB data'
  cached: 'boolean - Whether file was cached locally'
  memoryCached: 'boolean - Whether structure data is available through _dataRef'
