name: open_protein_viewer
version: 1.2.0
description: 'Open an interactive 3D protein structure viewer from cached data, a local PDB file, an online PDB URL, a UniProt/AlphaFold accession, a PDB ID, or a gene name. Online structures are downloaded automatically.'
category: protein
keywords: ['open', 'viewer', '3d', 'protein', 'structure', 'pdb', 'molecular', 'visualization']
priority: 1
execution:
  type: built-in
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: false
parameters:
  type: object
  properties:
    pdb_id:
      type: string
      description: 'RCSB PDB ID. For backward compatibility, UniProt accessions and AlphaFold model IDs are also recognized.'
      examples: ['1TUP', '2BEG', 'P04637', 'AF-P04637-F1-model_v6']
    uniprot_id:
      type: string
      description: "UniProt accession used to download the corresponding AlphaFold PDB model (e.g., 'P04637')"
      examples: ['P04637', 'P00350', 'P0A7B8']
    geneName:
      type: string
      description: 'Gene name as an alternative identifier; resolves and downloads the best available AlphaFold structure'
      examples: ['p53', 'lacZ', 'dnaA', 'hemoglobin']
    organism:
      type: string
      description: 'Organism name for gene name searches'
      default: 'Homo sapiens'
      examples: ['Homo sapiens', 'Escherichia coli', 'Mus musculus']
    file_path:
      type: string
      description: 'Absolute path to a local PDB file accessible to CodeXomics'
      examples: ['/Users/name/Downloads/AF-P04637-F1-model_v6.pdb', 'C:\\Data\\1TUP.pdb']
    structure_url:
      type: string
      description: 'HTTP(S) URL of a PDB file to download and open automatically'
      examples:
        - 'https://alphafold.ebi.ac.uk/files/AF-P04637-F1-model_v6.pdb'
        - 'https://files.rcsb.org/download/1TUP.pdb'
    data_ref:
      type: string
      description: 'Cached structure reference returned as _dataRef by fetch_alphafold_structure or fetch_protein_structure'
    protein_name:
      type: string
      description: 'Optional display name for the structure'
    representation:
      type: string
      enum: ['cartoon', 'surface', 'stick', 'ball_stick', 'ribbon']
      description: '3D representation style'
      default: 'cartoon'
    color_scheme:
      type: string
      enum: ['chain', 'secondary', 'atom', 'residue', 'temperature']
      description: 'Coloring scheme for visualization'
      default: 'chain'
    show_ligands:
      type: boolean
      description: 'Display bound ligands and cofactors'
      default: true
    show_waters:
      type: boolean
      description: 'Display water molecules'
      default: false
    center_on_ligand:
      type: boolean
      description: 'Center view on largest ligand if present'
      default: false
    viewer_type:
      type: string
      enum: ['ngl', 'default']
      description: 'Molecular viewer to use'
      default: 'default'
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
  required: []
sample_usages:
  - user_query: 'Open the AlphaFold model that was just downloaded for p53'
    tool_call: "open_protein_viewer(uniprot_id='P04637', representation='cartoon', color_scheme='temperature')"
    thought: 'The UniProt accession identifies the AlphaFold model directly; the viewer downloads it if it is not already cached'
    expected_result: 'AlphaFold p53 structure opens as a cartoon colored by confidence values stored in the PDB B-factor column'

  - user_query: 'Open p53 crystal structure in 3D viewer'
    tool_call: "open_protein_viewer(pdb_id='1TUP', representation='cartoon', show_ligands=true)"
    thought: 'User wants to visualize p53 crystal structure with bound DNA'
    expected_result: '3D viewer opens showing p53 structure with cartoon representation and DNA ligand'

  - user_query: 'Visualize lacZ enzyme structure'
    tool_call: "open_protein_viewer(geneName='lacZ', organism='Escherichia coli', color_scheme='secondary', representation='ribbon')"
    thought: 'User wants to see lacZ structure with secondary structure coloring'
    expected_result: 'lacZ structure displayed with ribbon representation and secondary structure colors'

  - user_query: 'Open hemoglobin structure focused on heme group'
    tool_call: "open_protein_viewer(geneName='hemoglobin', show_ligands=true, center_on_ligand=true, representation='surface')"
    thought: 'User wants hemoglobin structure centered on heme group with surface representation'
    expected_result: 'Hemoglobin structure with surface view centered on heme ligand'

  - user_query: 'Open a downloaded local AlphaFold PDB file'
    tool_call: "open_protein_viewer(file_path='/path/to/AF-P04637-F1-model_v6.pdb', representation='cartoon')"
    thought: 'The requested structure already exists on disk and can be loaded directly'
    expected_result: 'Local PDB file opens in the interactive viewer without another network request'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - protein
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  gene_not_found: Returns error if gene not found
  structure_not_found: Returns error if structure not found
returns:
  success: 'boolean - Whether viewer opened successfully'
  structureId: 'string - PDB ID, AlphaFold model ID, or local/URL-derived identifier of the loaded structure'
  pdbId: 'string - RCSB PDB ID when an experimental structure was loaded'
  uniprotId: 'string - UniProt accession when an AlphaFold structure was loaded'
  representationUsed: 'string - Requested 3D representation style'
  colorSchemeUsed: 'string - Requested structure color scheme'
  source: 'string - Resolved source such as Structure cache, Local PDB file, Online PDB URL, AlphaFold, or RCSB PDB'
