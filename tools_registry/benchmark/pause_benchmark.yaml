name: 'pause_benchmark'
description: 'Pause the currently running benchmark. The benchmark can be resumed later with resume_benchmark.'
version: '1.0.0'
author: 'CodeXomics'
category: 'benchmark'
intent: 'benchmark_management'
priority: 1
keywords: ['benchmark', 'pause', 'suspend', 'hold', 'freeze']
aliases: ['suspend_benchmark', 'hold_benchmark']
enabled: true

parameters:
  properties: {}

responses:
  success:
    type: 'object'
    properties:
      success:
        type: 'boolean'
        example: true
      message:
        type: 'string'
        example: 'Benchmark paused'
  error:
    type: 'object'
    properties:
      success:
        type: 'boolean'
        example: false
      error:
        type: 'string'
        example: 'No benchmark is currently running'

usage_examples:
  - description: 'Pause the running benchmark'
    input: {}
    expected_output:
      success: true
      message: 'Benchmark paused'

integration:
  mcp_tools: false
  dynamic_registry: true
  builtin_tools: true
  benchmark_framework: true
