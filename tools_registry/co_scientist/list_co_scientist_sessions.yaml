name: 'list_co_scientist_sessions'
version: '1.0.0'
description: 'List existing independent Co-Scientist research sessions and their current discovery state.'
category: 'co_scientist'
keywords:
  - 'co-scientist'
  - 'co scientist'
  - 'list research sessions'
  - 'scientific discovery sessions'
  - 'hypothesis sessions'
  - 'research memory'
priority: 2

execution:
  type: 'client'
  timeout: 5000
  retries: 0
  requires_auth: false
  requires_data: false
  requires_network: false

parameters:
  type: 'object'
  properties:
    includeArchived:
      type: 'boolean'
      description: 'Whether archived sessions should be included.'
      default: false
  required: []

sample_usages:
  - user_query: 'Show my Co-Scientist sessions.'
    tool_call: 'list_co_scientist_sessions(includeArchived=false)'
    expected_result: 'A list of session summaries including evidence counts, hypothesis counts, and top hypothesis state.'

relationships:
  depends_on: []
  conflicts_with: []
  enhances: ['get_co_scientist_report']
  alternatives: []
  follow_up: ['get_co_scientist_report']

metadata:
  tags: ['co-scientist', 'research-session', 'state']
  complexity: 'simple'
  usage_pattern: 'occasional'

returns:
  success: 'boolean - Whether sessions were listed.'
  count: 'number - Number of matching sessions.'
  sessions: 'array - Session summaries.'
