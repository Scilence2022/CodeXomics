name: 'add_co_scientist_evidence'
version: '1.0.0'
description: 'Add literature, dataset, experiment, observation, or scientist feedback evidence to a Co-Scientist session memory.'
category: 'co_scientist'
keywords:
  - 'co-scientist'
  - 'co scientist'
  - 'add evidence'
  - 'literature evidence'
  - 'experimental feedback'
  - 'lab result'
  - 'research memory'
  - 'scientist feedback'
  - 'paper evidence'
priority: 1

execution:
  type: 'client'
  timeout: 10000
  retries: 0
  requires_auth: false
  requires_data: false
  requires_network: false

parameters:
  type: 'object'
  properties:
    sessionId:
      type: 'string'
      description: 'Co-Scientist session ID.'
    evidence:
      description: 'Evidence item, evidence string, or array of evidence items.'
      oneOf:
        - type: 'string'
        - type: 'object'
        - type: 'array'
    evidenceType:
      type: 'string'
      enum: ['literature', 'dataset', 'experiment', 'observation', 'feedback', 'protocol', 'other']
      description: 'Evidence type applied when an item does not provide its own type.'
      default: 'literature'
    source:
      type: 'string'
      description: 'Citation, file path, database, or human source.'
      default: ''
    reliability:
      type: 'string'
      enum: ['low', 'medium', 'high']
      description: 'Evidence reliability estimate.'
      default: 'medium'
    direction:
      type: 'string'
      enum: ['supporting', 'contradicting', 'neutral', 'mixed']
      description: 'How the evidence relates to current hypotheses.'
      default: 'neutral'
    feedback:
      type: 'string'
      description: 'Optional free-form scientist feedback to append to session memory.'
      default: ''
  required: ['sessionId', 'evidence']

sample_usages:
  - user_query: 'Add this paper summary as high-confidence evidence to the Co-Scientist session.'
    tool_call: "add_co_scientist_evidence(sessionId='cosci_123', evidence='ROCK inhibition increases RPE phagocytosis in vitro.', evidenceType='literature', reliability='high')"
    expected_result: 'The evidence is added to persistent session memory and becomes available for review/ranking.'

relationships:
  depends_on: ['start_co_scientist_session']
  conflicts_with: []
  enhances: ['run_co_scientist_cycle', 'generate_co_scientist_hypotheses']
  alternatives: []
  follow_up: ['run_co_scientist_cycle']

metadata:
  tags: ['co-scientist', 'evidence', 'feedback', 'memory']
  complexity: 'moderate'
  usage_pattern: 'common'

returns:
  success: 'boolean - Whether evidence was added.'
  sessionId: 'string - Co-Scientist session ID.'
  added: 'number - Number of evidence records added.'
  evidenceCount: 'number - Total evidence records in the session.'
