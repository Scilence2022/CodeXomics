name: 'run_co_scientist_cycle'
version: '1.0.0'
description: 'Run one or more Co-Scientist discovery cycles: generation as needed, reflection, tournament ranking, proximity clustering, evolution, and meta-review.'
category: 'co_scientist'
keywords:
  - 'co-scientist'
  - 'co scientist'
  - 'run cycle'
  - 'scientific discovery loop'
  - 'reflect hypotheses'
  - 'rank hypotheses'
  - 'evolve hypotheses'
  - 'tournament'
  - 'meta-review'
  - 'autonomous scientist'
priority: 1

execution:
  type: 'client'
  timeout: 30000
  retries: 0
  requires_auth: false
  requires_data: false
  requires_network: false

parameters:
  type: 'object'
  properties:
    sessionId:
      type: 'string'
      description: 'Co-Scientist session ID.'
    cycles:
      type: 'number'
      description: 'Number of discovery cycles to run.'
      default: 1
      minimum: 1
      maximum: 5
    generateCount:
      type: 'number'
      description: 'Hypotheses to create if the session has none or generateEachCycle is true.'
      default: 3
      minimum: 1
      maximum: 12
    generateEachCycle:
      type: 'boolean'
      description: 'Whether to add fresh hypotheses before each cycle.'
      default: false
    reviewDepth:
      type: 'string'
      enum: ['standard', 'recurrent']
      description: 'Reflection strategy. recurrent revisits already reviewed hypotheses.'
      default: 'standard'
    includeEvolution:
      type: 'boolean'
      description: 'Whether the Evolution agent should refine top-ranked hypotheses.'
      default: true
    evolutionCount:
      type: 'number'
      description: 'Number of top hypotheses to evolve each cycle.'
      default: 2
      minimum: 0
      maximum: 5
    maxComparisons:
      type: 'number'
      description: 'Maximum pairwise tournament comparisons in this cycle.'
      minimum: 1
      maximum: 300
    topN:
      type: 'number'
      description: 'Number of top hypotheses to include in the returned report.'
      default: 5
      minimum: 1
      maximum: 20
  required: ['sessionId']

sample_usages:
  - user_query: 'Run a Co-Scientist cycle and rank the hypotheses.'
    tool_call: "run_co_scientist_cycle(sessionId='cosci_123', cycles=1, includeEvolution=true, evolutionCount=2)"
    expected_result: 'The session is reviewed, ranked, clustered, evolved, and summarized with top hypotheses.'

relationships:
  depends_on: ['start_co_scientist_session']
  conflicts_with: []
  enhances: ['get_co_scientist_report']
  alternatives: ['coordinate_task']
  follow_up: ['get_co_scientist_report', 'add_co_scientist_evidence']

metadata:
  tags: ['co-scientist', 'cycle', 'ranking', 'evolution', 'meta-review']
  complexity: 'complex'
  usage_pattern: 'common'

returns:
  success: 'boolean - Whether the cycle completed.'
  iterations: 'number - Current session iteration count.'
  cycleSummaries: 'array - Summary of generation, review, ranking, evolution, and meta-review steps.'
  report: 'object - Co-Scientist report with ranked hypotheses and next actions.'
