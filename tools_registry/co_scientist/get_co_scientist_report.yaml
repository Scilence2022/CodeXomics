name: 'get_co_scientist_report'
version: '1.0.0'
description: 'Get a structured Co-Scientist report with ranked hypotheses, reviews, proximity graph, meta-review guidance, and next actions.'
category: 'co_scientist'
keywords:
  - 'co-scientist'
  - 'co scientist'
  - 'research report'
  - 'hypothesis report'
  - 'ranked hypotheses'
  - 'top hypotheses'
  - 'meta-review'
  - 'scientific roadmap'
priority: 1

execution:
  type: 'client'
  timeout: 10000
  retries: 0
  requires_auth: false
  requires_data: false
  requires_network: false

parameters:
  type: 'object'
  properties:
    sessionId:
      type: 'string'
      description: 'Co-Scientist session ID.'
    topN:
      type: 'number'
      description: 'Number of top hypotheses to include.'
      default: 5
      minimum: 1
      maximum: 20
    includeEvidence:
      type: 'boolean'
      description: 'Whether to include full evidence records.'
      default: false
    includeActivityLog:
      type: 'boolean'
      description: 'Whether to include the full internal agent activity log.'
      default: false
  required: ['sessionId']

sample_usages:
  - user_query: 'Give me the Co-Scientist report for this session.'
    tool_call: "get_co_scientist_report(sessionId='cosci_123', topN=5, includeEvidence=true)"
    expected_result: 'A report of top hypotheses, latest reviews, tournament state, meta-review guidance, and next actions.'

relationships:
  depends_on: ['start_co_scientist_session']
  conflicts_with: []
  enhances: []
  alternatives: ['generate_research_report']
  follow_up: ['add_co_scientist_evidence', 'run_co_scientist_cycle']

metadata:
  tags: ['co-scientist', 'report', 'ranked-hypotheses', 'roadmap']
  complexity: 'simple'
  usage_pattern: 'common'

returns:
  success: 'boolean - Whether the report was created.'
  sessionId: 'string - Co-Scientist session ID.'
  report: 'object - Structured report.'
