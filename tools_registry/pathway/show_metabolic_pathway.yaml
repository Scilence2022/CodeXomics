name: show_metabolic_pathway
version: 1.0.0
description: Display metabolic pathway visualization
category: pathway
keywords:
  - show
  - metabolic
  - pathway
  - visualization
priority: 2
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    pathwayName:
      type: string
      description: Name of the metabolic pathway, such as glycolysis
    highlightGenes:
      type: array
      items: { type: string }
      description: Gene names to highlight in the visualization
    organism:
      type: string
      description: Organism name for pathway context
  required: [pathwayName]
sample_usages:
  - user_query: "Show the glycolysis pathway"
    tool_call: "show_metabolic_pathway(pathwayName='glycolysis')"
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - pathway
    - important
  complexity: moderate
  usage_pattern: common
error_handling: {}
returns:
  success: boolean - Whether operation was successful
  result: object - Operation result
