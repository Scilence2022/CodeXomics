name: get_interpro_entry_details
version: 1.1.0
description: "Retrieve metadata for an InterPro accession. Use search_interpro_entry to look up an accession by name."
category: database
keywords: ['get', 'interpro', 'entry', 'details', 'description', 'member databases', 'structure']
priority: 2
execution:
  type: server
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    interpro_id:
      type: string
      description: "InterPro accession ID (e.g., 'IPR000001', 'IPR012345')"
      pattern: '^[Ii][Pp][Rr][0-9]{6}$'
      examples: ['IPR000001', 'IPR000719', 'IPR001440', 'IPR003961']
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
    interproId:
      type: string
      description: InterPro entry ID (e.g., IPR000001)
    output_format:
      type: string
      description: Amount of detail to return.
      enum:
      - minimal
      - summary
      - detailed
      default: detailed
  required: []
  anyOf:
    - required: [interpro_id]
    - required: [interproId]
sample_usages:
  - user_query: "Read the InterPro entry IPR000719."
    tool_call: '{"tool_name": "get_interpro_entry_details", "parameters": {"interpro_id": "IPR000719"}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - database
    - important
  complexity: moderate
  usage_pattern: common
error_handling:
  network_error: Returns error if database is unavailable
  query_error: Returns error if query is invalid
returns:
  details: "Entry metadata. Minimal output contains interproId, name and type."
