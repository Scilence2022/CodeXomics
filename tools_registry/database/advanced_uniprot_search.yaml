name: advanced_uniprot_search
version: 1.1.0
description: "Search UniProt using one or more criteria combined with AND. Use flat arguments or query_fields and filters."
category: database
keywords: ['advanced', 'uniprot', 'search', 'multiple', 'filters', 'boolean', 'complex']
priority: 2
execution:
  type: server
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    query_fields:
      type: object
      description: Multiple search fields with their values
      properties:
        protein_name:
          type: string
          description: Protein name to search for
        gene_name:
          type: string
          description: Gene name to search for
        organism:
          type: string
          description: Organism name or taxonomy ID
        keyword:
          type: string
          description: Functional keywords
    filters:
      type: object
      description: Additional filters for search results
      properties:
        reviewed_only:
          type: boolean
          description: Include only reviewed (Swiss-Prot) entries
          default: false
    max_results:
      type: number
      description: 'Maximum number of results to return'
      minimum: 1
      maximum: 1000
      default: 20
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
    proteinName:
      type: string
      description: Protein name query
    geneName:
      type: string
      description: Gene name query
    organism:
      type: string
      description: Organism filter
    keywords:
      type: array
      items:
        type: string
      description: Keyword filters
    subcellularLocation:
      type: string
      description: Subcellular location filter
    function:
      type: string
      description: Protein function filter
    reviewedOnly:
      type: boolean
      description: Only reviewed entries
    limit:
      type: number
      description: Maximum results
      default: 20
  required: []
  anyOf:
    - required: [query_fields]
    - required: [proteinName]
    - required: [geneName]
    - required: [organism]
    - required: [keywords]
    - required: [subcellularLocation]
    - required: [function]
    - required: [reviewedOnly]
    - required: [filters]
sample_usages:
  - user_query: "Find reviewed human kinase entries."
    tool_call: '{"tool_name": "advanced_uniprot_search", "parameters": {"query_fields": {"protein_name": "kinase", "organism": "Homo sapiens"}, "filters": {"reviewed_only": true}}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - database
    - important
  complexity: moderate
  usage_pattern: common
error_handling:
  network_error: Returns error if database is unavailable
  query_error: Returns error if query is invalid
returns:
  count: "Number of returned entries."
  results: "Matching protein summaries."
