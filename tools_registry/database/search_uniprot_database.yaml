name: search_uniprot_database
version: 1.1.0
description: 'Search UniProt database with various search types including protein names, gene names, organisms, and functional keywords.'
category: database
keywords: ['search', 'uniprot', 'database', 'protein', 'gene', 'organism', 'function']
priority: 1
execution:
  type: server
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    search_query:
      type: string
      description: 'Main search term (protein name, gene name, keyword, etc.)'
      examples: ['insulin', 'p53', 'kinase', 'membrane protein', 'E. coli']
    search_type:
      type: string
      enum: ['protein_name', 'gene_name', 'organism', 'keyword', 'uniprot_id', 'sequence', 'all_fields']
      description: 'Type of search to perform in UniProt'
      default: 'keyword'
    organism:
      type: string
      description: 'Filter results by organism name or taxonomy ID'
      examples: ['Homo sapiens', 'Escherichia coli', '9606', '511145']
    reviewed_only:
      type: boolean
      description: 'Search only reviewed entries (Swiss-Prot)'
      default: false
    max_results:
      type: number
      description: 'Maximum number of results to return'
      minimum: 1
      maximum: 1000
      default: 20
    output_fields:
      type: array
      items:
        type: string
        enum: ['accession', 'protein_name', 'gene_name', 'organism', 'length', 'function', 'sequence']
      description: Standard summary fields are always returned when available. Include sequence to request the additional sequence field.
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
    query:
      type: string
      description: Search query term
    searchType:
      type: string
      description: 'Type of search: protein_name, gene_name, uniprot_id, organism, keyword, annotation, or sequence'
      enum:
      - protein_name
      - gene_name
      - uniprot_id
      - organism
      - keyword
      - annotation
      - sequence
    reviewedOnly:
      type: boolean
      description: Only return reviewed (SwissProt) entries
    limit:
      type: number
      description: Maximum number of results to return
      default: 20
    includeSequence:
      type: boolean
      description: Include protein sequences in results
      default: false
  required: []
  anyOf:
    - required: [search_query]
    - required: [query]
    - required: [organism]
sample_usages:
  - user_query: "Find reviewed entries for the gene lacZ."
    tool_call: '{"tool_name": "search_uniprot_database", "parameters": {"search_query": "lacZ", "search_type": "gene_name", "reviewed_only": true}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - database
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  network_error: Returns error if database is unavailable
  query_error: Returns error if query is invalid
returns:
  count: "Number of returned entries."
  results: "Matching protein summaries."
