name: get_uniprot_entry
version: 1.1.0
description: 'Retrieve detailed information for a specific UniProt entry including sequence, annotations, functions, and cross-references.'
category: database
keywords: ['get', 'uniprot', 'entry', 'details', 'sequence', 'annotations', 'function']
priority: 1
execution:
  type: server
  timeout: 30000
  retries: 2
  requires_auth: false
  requires_data: false
  requires_network: true
parameters:
  type: object
  properties:
    uniprot_id:
      type: string
      description: "UniProt accession ID (e.g., 'P04637', 'Q9UHD8')"
      pattern: '^[A-Z0-9]{6,10}$'
      examples: ['P04637', 'P00350', 'P0A7B8', 'Q9UHD8']
    geneName:
      type: string
      description: 'Gene name as alternative to UniProt ID'
      examples: ['p53', 'lacZ', 'dnaA', 'BRCA1']
    organism:
      type: string
      description: 'Organism name for gene name resolution'
      default: 'Homo sapiens'
      examples: ['Homo sapiens', 'Escherichia coli', 'Mus musculus']
    include_sequence:
      type: boolean
      description: 'Include protein sequence in results'
      default: true
    include_features:
      type: boolean
      description: 'Include sequence features and annotations'
      default: true
    include_function:
      type: boolean
      description: 'Include functional annotations and GO terms'
      default: true
    clientId:
      type: string
      description: 'Browser client ID for multi-window support'
      default: 'default'
    uniprotId:
      type: string
      description: UniProt accession ID
    includeSequence:
      type: boolean
      description: Include protein sequence
      default: true
    includeFeatures:
      type: boolean
      description: Include protein features
      default: true
    includeFunction:
      type: boolean
      description: Include function description and GO terms
      default: true
    includeCrossRefs:
      type: boolean
      description: Include cross-references
      default: false
    gene_name:
      type: string
      description: Alternative spelling of geneName.
  required: []
  anyOf:
    - required: [gene_name]
    - required: [uniprot_id]
    - required: [uniprotId]
    - required: [geneName]
sample_usages:
  - user_query: "Get UniProt entry P04637 without its sequence."
    tool_call: '{"tool_name": "get_uniprot_entry", "parameters": {"uniprot_id": "P04637", "include_sequence": false}}'
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - database
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  network_error: Returns error if database is unavailable
  query_error: Returns error if query is invalid
returns:
  entry_info: "Accession, entry name and protein metadata."
  protein_sequence: "Optional protein sequence."
  features: "Optional feature list."
  function: "Optional function and GO terms."
  cross_references: "Optional database cross-references."
