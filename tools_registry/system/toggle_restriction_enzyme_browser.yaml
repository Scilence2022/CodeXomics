name: 'toggle_restriction_enzyme_browser'
version: '1.0.0'
description: 'Open, close, or toggle the Restriction Enzyme Browser.'
category: 'system'
subcategory: 'interface_controls'
keywords:
  - 'restriction enzyme browser'
  - 'enzyme browser'
  - '限制酶浏览器'
  - '限制性内切酶浏览器'
priority: 1
execution:
  type: 'client'
  timeout: 5000
  retries: 0
  requires_auth: false
  requires_data: false
  requires_network: false
parameters:
  type: 'object'
  properties:
    action:
      type: 'string'
      description: "Use 'open' or 'close' to set visibility, or 'toggle' to switch the current state."
      enum: ['open', 'close', 'toggle']
  required: ['action']
sample_usages:
  - user_query: 'Open the Restriction Enzyme Browser window'
    tool_call: "toggle_restriction_enzyme_browser(action='open')"
    expected_result: 'The window is open'
  - user_query: 'Close the Restriction Enzyme Browser window'
    tool_call: "toggle_restriction_enzyme_browser(action='close')"
    expected_result: 'The window is closed'
returns:
  success: 'boolean - Whether the window action succeeded'
  new_state: "string - Either 'open' or 'closed' after the action"
