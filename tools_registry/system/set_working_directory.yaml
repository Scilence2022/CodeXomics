name: 'set_working_directory'
description: 'Set the current working directory for the application. All file operations (load, export, save) will use this directory as the base path. Use this when the user specifies a directory path for data files.'
version: '1.1.0'
author: 'CodeXomics'
category: 'system'
intent: 'system_management'
priority: 1
keywords: ['directory', 'folder', 'path', 'working', 'current', 'set', 'change', 'cd', 'working directory', 'set directory']
aliases: ['change_directory', 'cd', 'set_dir', 'change_working_dir']
enabled: true

# Tool execution metadata
execution:
  type: 'client'
  timeout: 5000
  retries: 1
  requires_auth: false
  requires_data: false
  requires_network: false

parameters:
  type: 'object'
  properties:
    directory_path:
      type: 'string'
      description: 'The absolute or relative path to set as working directory'
      examples: ['/Users/song/test-data', '/tmp/genome-analysis']
    use_home_directory:
      type: 'boolean'
      description: 'Set to true to use user home directory as working directory'
      default: false
    create_if_missing:
      type: 'boolean'
      description: "Create the directory if it doesn't exist (default: false)"
      default: false
    validate_permissions:
      type: 'boolean'
      description: 'Validate read/write permissions for the directory (default: true)'
      default: true
  required: ['directory_path']

# High-quality examples for few-shot learning
sample_usages:
  - user_query: 'Set working directory to /Users/song/genome-data'
    tool_call: 'set_working_directory(directory_path="/Users/song/genome-data")'
    thought: 'User wants to change the working directory to a specific path'
    expected_result: 'Working directory changed successfully'

  - user_query: 'Change directory to /tmp/test-data/'
    tool_call: 'set_working_directory(directory_path="/tmp/test-data/")'
    thought: 'User wants to change to a specific directory for file operations'
    expected_result: 'Working directory changed to /tmp/test-data/'

  - user_query: 'Set working directory to home'
    tool_call: 'set_working_directory(use_home_directory=true)'
    thought: 'User wants to reset working directory to home'
    expected_result: 'Working directory set to user home directory'

responses:
  success:
    type: 'object'
    properties:
      success:
        type: 'boolean'
        example: true
      message:
        type: 'string'
        example: 'Working directory set successfully'
      current_directory:
        type: 'string'
        example: '/Users/song/test-data'
      previous_directory:
        type: 'string'
        example: '/Users/song'
      permissions:
        type: 'object'
        properties:
          readable:
            type: 'boolean'
          writable:
            type: 'boolean'
        example:
          readable: true
          writable: true
  error:
    type: 'object'
    properties:
      success:
        type: 'boolean'
        example: false
      error:
        type: 'string'
        example: 'Directory not found or access denied'
      attempted_path:
        type: 'string'
        example: '/invalid/path'

# Related tools
relationships:
  - tool: 'load_genome_file'
    relationship: 'commonly_used_before'
    description: 'Set working directory before loading files from it'
  - tool: 'export_fasta_sequence'
    relationship: 'commonly_used_before'
    description: 'Set working directory before exporting files'

error_handling:
  - condition: 'Directory does not exist'
    response:
      success: false
      error: "Directory '/path/to/nonexistent' does not exist"
      attempted_path: '/path/to/nonexistent'

  - condition: 'Permission denied'
    response:
      success: false
      error: "Permission denied accessing directory '/restricted/path'"
      attempted_path: '/restricted/path'

  - condition: 'Invalid path format'
    response:
      success: false
      error: 'Invalid path format provided'
      attempted_path: 'invalid-path'

  - condition: 'No parameters provided'
    response:
      success: false
      error: 'Either directory_path or use_home_directory must be provided'

security_considerations:
  - 'Validates directory existence and permissions before setting'
  - 'Prevents setting directories outside allowed system boundaries'
  - 'Logs all directory changes for audit purposes'
  - 'Handles cross-platform path normalization'

integration:
  mcp_tools: true
  dynamic_registry: true
  builtin_tools: true
  benchmark_framework: true

compatibility:
  min_version: '1.0.0'
  platforms: ['desktop', 'web']

benchmark_usage:
  description: 'Benchmarks should use this tool to set test directories'
  examples:
    - 'Set benchmark test directory before running file loading tests'
    - 'Create isolated test environment for each benchmark suite'
    - 'Reset to home directory after benchmark completion'
