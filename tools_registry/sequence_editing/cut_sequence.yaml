name: cut_sequence
version: 1.0.0
description: Cut a sequence region into the sequence-editing clipboard and queue a cut Action. This is not a checklist Task. Use paste_sequence after this to queue a move, and execute_actions(auto_save=true) to apply queued sequence-editing Actions.
category: sequence_editing
keywords:
  - cut
  - sequence
  - clipboard
  - delete
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    chromosome:
      type: string
      description: Chromosome identifier
    start:
      type: number
      description: Start position (1-based coordinate)
      minimum: 1
    end:
      type: number
      description: End position (1-based coordinate)
      minimum: 1
  required:
    - chromosome
    - start
    - end
sample_usages:
  - user_query: Cut bases 1000 to 1500 from NC_000913.3 so I can move them elsewhere
    tool_call: cut_sequence(chromosome='NC_000913.3', start=1000, end=1500)
    thought: User wants to copy a sequence region to the Actions clipboard and queue its deletion.
    expected_result: Cut Action is queued and clipboard contains the selected sequence.
relationships:
  depends_on: []
  conflicts_with: []
  enhances:
    - paste_sequence
  alternatives: []
  prerequisites: []
  follow_up:
    - paste_sequence
    - get_action_list
    - execute_actions
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_region: Returns error if region is invalid
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  actionId: string - Unique identifier for this Action
  details: object - Contains chromosome, start, end, strand, and length
