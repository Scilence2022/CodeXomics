name: clear_actions
version: 1.0.0
description: Clear sequence-editing Actions from the queue. Actions are queued genome edit operations, not checklist Tasks.
category: sequence_editing
keywords:
  - clear
  - actions
  - queue
priority: 2
resident: true
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    status:
      type: string
      description: Clear only actions with this status. Defaults to all.
      enum: [all, pending, executing, completed, failed]
      default: all
    forced:
      type: boolean
      description: Whether to force clear, skip confirmation prompt
      default: false
  required: []
sample_usages:
  - user_query: Clear the pending sequence editing actions
    tool_call: clear_actions(status='pending', forced=true)
    thought: User wants to remove queued sequence-editing Actions without clearing checklist Tasks.
    expected_result: Pending Actions are removed from the sequence-editing queue.
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - important
  complexity: moderate
  usage_pattern: common
error_handling:
  invalid_region: Returns error if region is invalid
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  clearedActions: number - Number of actions removed
  remainingActions: number - Number of actions left in the queue
