name: replace_sequence
version: 1.1.0
description: Queue replacement of a sequence region with a new DNA sequence as a sequence-editing Action. This is not a checklist Task. Call execute_actions(auto_save=true) to apply queued sequence-editing Actions.
category: sequence_editing
keywords:
  - replace
  - sequence
  - region
  - new
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    chromosome:
      type: string
      description: Chromosome identifier (e.g., "chr1", "chromosome1")
    start:
      type: number
      description: Start position (1-based genomic coordinate)
      minimum: 1
    end:
      type: number
      description: End position (1-based genomic coordinate)
      minimum: 1
    newSequence:
      type: string
      description: Alias for sequence. Use 'sequence' instead.
    sequence:
      type: string
      description: New DNA sequence to replace the existing region (only A, T, C, G, N allowed). If strand is "-", provide the sequence in reverse-strand/read orientation; execute_actions writes its reverse complement to the genomic forward sequence.
    strand:
      type: string
      enum:
        - '+'
        - '-'
      description: Target strand. Use "+" for forward genomic orientation or "-" when the replacement sequence is written in reverse-strand/read orientation.
      default: '+'
  required:
    - chromosome
    - start
    - end
    - sequence
sample_usages:
  - user_query: Replace the sequence in region 400000 to 400200 with GCTAGCTAGCTAGCTA
    tool_call: replace_sequence(chromosome='NC_000913.3', start=400000, end=400200, sequence='GCTAGCTAGCTAGCTA')
    thought: User wants to replace a genomic region with a new sequence
    expected_result: Replace action created and queued for execution
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up:
    - execute_actions
    - get_action_list
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_region: Returns error if region is invalid
  invalid_sequence: Returns error if sequence contains non-DNA characters
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  action_id: string - Unique identifier for this action
  message: string - Human-readable result description
  details: object - Contains chromosome, start, end, originalLength, and newLength information
