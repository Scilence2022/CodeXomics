name: insert_sequence
version: 1.1.0
description: Queue insertion of a DNA sequence at a specified position as a sequence-editing Action. This is not a checklist Task. Call execute_actions(auto_save=true) to apply queued sequence-editing Actions.
category: sequence_editing
keywords:
  - insert
  - sequence
  - dna
  - position
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    chromosome:
      type: string
      description: Chromosome identifier (e.g., "chr1", "chromosome1")
    position:
      type: number
      description: Insert position (1-based genomic coordinate)
      minimum: 1
    start:
      type: number
      description: Alias for position (1-based genomic coordinate). Use 'position' instead.
      minimum: 1
    sequence:
      type: string
      description: DNA sequence to insert (only A, T, C, G, N characters allowed)
    newSequence:
      type: string
      description: Alias for sequence parameter. Use 'sequence' instead.
  required:
    - chromosome
    - position
    - sequence
sample_usages:
  - user_query: Insert the DNA sequence ATGCGATCGATCGATCG at position 300000
    tool_call: insert_sequence(chromosome='NC_000913.3', position=300000, sequence='ATGCGATCGATCGATCG')
    thought: User wants to insert a specific DNA sequence at a given position
    expected_result: Insert action created and queued for execution
  - user_query: Insert a 17bp sequence at position 300000 on the current chromosome
    tool_call: insert_sequence(chromosome='NC_000913.3', position=300000, sequence='ATGCGATCGATCGATCG')
    thought: User wants to insert a sequence at a specific genomic position
    expected_result: Insert action created successfully
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up:
    - execute_actions
    - get_action_list
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_region: Returns error if region is invalid
  invalid_sequence: Returns error if sequence contains non-DNA characters
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  action_id: string - Unique identifier for this action
  message: string - Human-readable result description
  details: object - Contains chromosome, position, sequenceLength information
