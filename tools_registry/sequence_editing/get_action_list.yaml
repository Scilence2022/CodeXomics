name: get_action_list
version: 1.0.0
description: Get the current sequence-editing Action queue. Actions are queued genome edit operations, not checklist Tasks.
category: sequence_editing
keywords:
  - get
  - action
  - list
  - pending
  - completed
priority: 2
resident: true
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    status:
      type: string
      description: Filter actions by status. Defaults to all.
      enum: [all, pending, executing, completed, failed]
      default: all
  required: []
sample_usages:
  - user_query: Show the pending sequence editing actions
    tool_call: get_action_list(status='pending')
    thought: User wants to inspect queued genome-editing Actions without opening the UI.
    expected_result: Returns pending sequence-editing Actions.
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: []
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - important
  complexity: moderate
  usage_pattern: common
error_handling:
  invalid_region: Returns error if region is invalid
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  totalActions: number - Total number of actions in the queue
  filteredActions: number - Number of actions returned after filtering
  actions: array - Matching sequence-editing Actions
