name: delete_sequence
version: 1.0.0
description: Queue deletion of a sequence region as a sequence-editing Action. This is not a checklist Task. Call execute_actions(auto_save=true) to apply queued sequence-editing Actions.
category: sequence_editing
keywords:
  - delete
  - sequence
  - region
priority: 1
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    chromosome:
      type: string
      description: Chromosome identifier
    start:
      type: number
      description: Start position (1-based coordinate)
      minimum: 1
    end:
      type: number
      description: End position (1-based coordinate)
      minimum: 1
  required:
    - chromosome
    - start
    - end
sample_usages:
  - user_query: Delete bases 1000 to 2000 on NC_000913.3
    tool_call: delete_sequence(chromosome='NC_000913.3', start=1000, end=2000)
    thought: User wants to queue a DNA sequence deletion Action.
    expected_result: Delete Action is queued and ready for execute_actions.
relationships:
  depends_on: []
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up:
    - execute_actions
    - get_action_list
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_region: Returns error if region is invalid
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  actionId: string - Unique identifier for this Action
  details: object - Contains chromosome, start, end, strand, and length
