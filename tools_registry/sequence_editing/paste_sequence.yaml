name: paste_sequence
version: 1.0.0
description: Paste the current sequence clipboard at a specified genomic insertion position. Set reverse_complement=true to reverse-complement the clipboard sequence before it is pasted. Requires a previous copy_sequence or cut_sequence call. This creates a queued sequence-editing Action; execute_actions applies the queue.
category: sequence_editing
keywords:
  - paste
  - sequence
  - clipboard
  - position
priority: 1
resident: true
execution:
  type: client
  timeout: 15000
  retries: 2
  requires_auth: false
  requires_data: true
  requires_network: false
parameters:
  type: object
  properties:
    clientId:
      type: string
      description: Browser client ID for multi-window support
      default: default
    chromosome:
      type: string
      description: Chromosome identifier
    position:
      type: number
      description: Insert position (1-based genomic coordinate)
      minimum: 1
    start:
      type: number
      description: Alias for position. Use position instead.
      minimum: 1
    reverse_complement:
      type: boolean
      description: When true, reverse-complement the clipboard sequence before pasting it.
      default: false
    reverseComplement:
      type: boolean
      description: Alias for reverse_complement.
      default: false
  required:
    - chromosome
    - position
sample_usages:
  - user_query: Paste the copied sequence at position 5000
    tool_call: paste_sequence(chromosome='NC_000913.3', position=5000)
    thought: User wants to queue a paste Action using the current sequence clipboard.
    expected_result: Paste Action created and queued for execution.
  - user_query: Paste the copied sequence at position 5000 in reverse-complement mode
    tool_call: paste_sequence(chromosome='NC_000913.3', position=5000, reverse_complement=true)
    thought: User wants to reverse-complement the clipboard sequence before queueing the paste Action.
    expected_result: Reverse-complement paste Action created and queued for execution.
relationships:
  depends_on: [copy_sequence]
  conflicts_with: []
  enhances: []
  alternatives: []
  prerequisites: []
  follow_up: [execute_actions]
metadata:
  usage_count: 0
  success_rate: 0
  avg_execution_time: 0
  last_used: null
  tags:
    - sequence_editing
    - core
    - essential
  complexity: simple
  usage_pattern: frequent
error_handling:
  invalid_region: Returns error if region is invalid
  clipboard_error: Returns error if clipboard operation fails
returns:
  success: boolean - Whether operation was successful
  action_id: string - Unique identifier for this action
  message: string - Human-readable result description
  details: object - Contains chromosome, position, clipboardLength, and reverseComplement information
