site_name: CodeXomics Documentation
site_description: AI-Powered Bioinformatics Analysis Platform
site_author: CodeXomics Team
site_url: https://scilence2022.github.io/CodeXomics/

repo_name: Scilence2022/CodeXomics
repo_url: https://github.com/Scilence2022/CodeXomics
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  favicon: assets/favicon.ico
  logo: assets/logo.png
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

exclude_docs: |
  _archive/

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: info

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

extra:
  version:
    method: mike
    name: v0.7.0-beta
    default: v0.7.0-beta
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Scilence2022/CodeXomics
  generator: false

copyright: Copyright &copy; 2024-2026 CodeXomics Team

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: user-guides/GETTING_STARTED.md
      - User Guide: user-guides/USER_GUIDE.md
      - Agents & Smart Execution: user-guides/AGENTS_COLLABORATION_GUIDE.md
      - Plugin Marketplace: user-guides/PLUGIN_MARKETPLACE_GUIDE.md
      - MCP Server Integration: user-guides/MCP_SERVER_GUIDE.md
      - FAQ: user-guides/FAQ.md
      - Troubleshooting: user-guides/TROUBLESHOOTING_GUIDE.md
  - Developer Guide:
      - Overview: developer-guides/DEVELOPER_GUIDE.md
      - AI Assistant Guidelines: developer-guides/AI_ASSISTANT_GUIDELINES.md
      - Plugin Development: developer-guides/PLUGIN_DEVELOPMENT_GUIDE.md
      - Build Instructions: developer-guides/build-instructions.md
      - Actions System:
          - Documentation: developer-guides/ACTIONS_SYSTEM_DOCUMENTATION.md
          - Quick Reference: developer-guides/ACTIONS_QUICK_REFERENCE.md
  - Architecture:
      - Multi-Agent System: architecture/CodeXomics_Multi_Agent_System_Technical_Specification.md
      - Plugin System: architecture/PLUGIN_SYSTEM_DEEP_ANALYSIS.md
      - Track System: architecture/TRACK_SYSTEM_ANALYSIS.md
      - Workspace: architecture/WORKSPACE_ARCHITECTURE.md
  - Reference:
      - BLAST Guide: reference/BLAST_GUIDE.md
      - Smart Execution: reference/SMART_EXECUTION_GUIDE.md
      - Benchmark Methods: reference/BENCHMARK_METHODS.md
      - Workspace Migration: reference/WORKSPACE_MIGRATION_GUIDE.md
  - Release Notes:
      - Release Guide: release-notes/RELEASE_GUIDE.md
      - v0.533beta: release-notes/RELEASE_NOTES_v0.533beta.md
      - v0.532beta: release-notes/RELEASE_NOTES_v0.532beta.md
